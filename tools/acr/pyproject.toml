[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aster-code-review-acr"
version = "0.1.0"
description = "Aster-Code-Review"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.0,<3",
  "openai-agents[any-llm]>=0.22,<0.23",
  "claude-agent-sdk==0.2.143",
  "pyyaml>=6.0",
]

[tool.setuptools]
packages = ["acr", "acr.core", "acr.agents", "acr.agents.openai_agents", "acr.agents.pi", "acr.agents.claude", "acr.tools", "acr.benchmark"]

[tool.setuptools.package-dir]
acr = "src"

[tool.setuptools.package-data]
acr = [
  "prompts/*.md",
  "prompts/personas/*.md",
  "scripts/*.md",
  "scripts/*.py",
  "scripts/*.sh",
]

"acr.agents.pi" = [
  "runtime/*.mjs",
]
