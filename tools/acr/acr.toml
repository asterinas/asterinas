# ACR portable runtime configuration.
#
# Keep credentials out of this file.  Set the environment variable named by
# `OPENAI_API_KEY` and `OPENAI_BASE_URL` before using the openai-agents backend.

[benchmark]
# Fetch diff benchmark commits from this Git remote when a problem does not
# declare its own `remote` and the commit is unavailable in the local repo.
remote = "https://github.com/asterinas/asterinas"

[agent]
backend = "openai-agents"
# Persona reviews, including combined mode.
review_model = "openai/gpt-6.1-sol"
# Verification, consolidation, summary, and benchmark grading.
postprocess_model = "openai/gpt-6.1-sol"
reasoning_effort = "medium"
postprocess_reasoning_effort = "medium"
wire_api = "responses"
per_persona_context = "auto"
max_concurrency = 6
# Omit timeout_seconds to allow a complete Agent run. Set a positive number
# only when a hard wall-clock limit per attempt is required.
# timeout_seconds=1200
# Retry failed agent runs from their initial input.
retries = 1
# Retry individual model requests within the current run, preserving history
# and tool results (openai-agents only).
model_retries = 6

# Per-agent tool allowlists. Edit these lists to change tool assembly without
# modifying Python. Combined review mode receives the union of its personas.
# `web.search` requires wire_api = "responses" and provider support.
[tools]
maintainability = ["source.read", "source.search", "git.show", "git.log", "git.blame","guideline.show", "web.search"]
development = ["source.read", "source.search", "git.show", "git.log", "git.blame", "guideline.show", "web.search"]
security = ["source.read", "source.search", "git.show", "git.log", "git.blame","guideline.show"]
hardware = ["source.read", "source.search", "git.show", "git.log", "git.blame", "guideline.show"]
documentation = ["source.read", "source.search", "git.show", "git.log", "git.blame", "guideline.show"]
verification = ["source.read", "source.search", "source.list", "git.show", "git.log", "git.blame", "web.search"]
consolidation = []
summary = []
grader = []

[provider]
# Use "openai" for the official OpenAI API, or "any-llm" for third-party relays.
adapter = "any-llm"
api_key_env = "OPENAI_API_KEY"
base_url_env = "OPENAI_BASE_URL"
