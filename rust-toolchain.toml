# When updating this file, remember to:
# - sync `osdk/src/commands/new/rust-toolchain.toml.template`
# - update the klint revision installed by the Docker image
# - run `nix flake update rust-overlay` to update `flake.lock`
# - update `minicov` in `Cargo.toml` if the OSDK tests run forever
[toolchain]
channel = "nightly-2026-11-16"
components = ["rust-src", "rustc-dev", "llvm-tools-preview"]
targets = ["x86_64-unknown-none", "riscv64imac-unknown-none-elf", "loongarch64-unknown-none-softfloat", "aarch64-unknown-none-softfloat"]
