alert:
  bigger_is_better: true
  threshold: 130%
chart:
  description: vhost_vsock_bench --backend vhost --direction g2h --buf-size 4K --bytes 1G
  legend: Average direct vhost-vsock guest-to-host throughput on {system}
  title: '[vhost-vsock/vhost] Guest-to-host throughput (4-KiB buffer)'
  unit: Mbits/sec
result_extraction:
  result_index: 7
  search_pattern: '^VHOST_VSOCK_RESULT vhost g2h 4096 '
runtime_config:
  aster_scheme: 'null'
  mem: 1G
  smp: 1
