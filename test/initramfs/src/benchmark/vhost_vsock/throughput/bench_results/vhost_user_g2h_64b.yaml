alert:
  bigger_is_better: true
  threshold: 130%
chart:
  description: vhost_vsock_bench --backend vhost-user --direction g2h --buf-size 64 --bytes 64M
  legend: Average vhost-user-vsock guest-to-host throughput on {system}
  title: '[vhost-vsock/vhost-user] Guest-to-host throughput (64-byte buffer)'
  unit: Mbits/sec
result_extraction:
  result_index: 7
  search_pattern: '^VHOST_VSOCK_RESULT vhost-user g2h 64 '
runtime_config:
  aster_scheme: 'null'
  mem: 1G
  smp: 1
