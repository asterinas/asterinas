alert:
  bigger_is_better: true
  threshold: 125%
chart:
  description: fio -filename=/ext2/fio-test -size=1G -bs=1M -direct=0
  legend: Average buffered I/O file write bandwidth on {system}
  title: '[Ext2] The bandwidth of sequential writes (buffered I/O, w/o IOMMU)'
  unit: MB/s
result_extraction:
  parser: fio_json
  direction: write
runtime_config:
  aster_scheme: 'null'
