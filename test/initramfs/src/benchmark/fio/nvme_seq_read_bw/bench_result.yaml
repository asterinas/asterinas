alert:
  bigger_is_better: true
  threshold: 125%
chart:
  description: fio -filename=/dev/nvme0n1 -size=1G -bs=1M -direct=1
  legend: Average file read bandwidth on {system}
  title: '[NVMe] The bandwidth of sequential reads'
  unit: MB/s
result_extraction:
  result_index: 2
  search_pattern: bw=[0-9]+
