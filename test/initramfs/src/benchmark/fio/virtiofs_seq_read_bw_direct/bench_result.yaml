alert:
  bigger_is_better: true
  threshold: 125%
chart:
  description: fio -filename=/virtiofs/fio-test -size=1G -bs=1M -direct=1
  legend: Average direct I/O file read bandwidth on {system}
  title: '[virtio-fs] The bandwidth of sequential reads (direct I/O, w/o IOMMU)'
  unit: MB/s
result_extraction:
  parser: fio_json
  direction: read
runtime_config:
  aster_scheme: 'null'
  virtiofs: 'on'
  virtiofs_tag: aster-virtiofs
