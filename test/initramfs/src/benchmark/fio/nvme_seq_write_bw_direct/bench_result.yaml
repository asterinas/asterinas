alert:
  bigger_is_better: true
  threshold: 125%
chart:
  description: fio -filename=/dev/nvme0n1 -size=1G -bs=1M -direct=1
  legend: Average direct I/O write bandwidth on {system}
  title: '[NVMe] The bandwidth of sequential writes (direct I/O, w/t IOMMU)'
  unit: MB/s
result_extraction:
  parser: fio_json
  direction: write
