# benchmark/problems.yaml — the review-problem suite (one queryable file).
#
# Schema: see ../spec/benchmark.md ("Schema").
# Conventions:
#   * Prose fields (source, desc, fix, expectation) are block scalars (>) and may
#     use Markdown `backticks` around code — literal text in YAML.
#   * `commit` (REQUIRED, top-level) is the snapshot every problem checks out (detached HEAD).
#     `remote` (OPTIONAL, top-level) is where to fetch `commit` from if it is not already local;
#     it defaults to https://github.com/asterinas/asterinas.
#       - In `diff` mode `commit` must be a full 40-char SHA (it is fetched by SHA:
#         PR-derived commits already sit on upstream main, synthetic ones are dangling
#         on the fork).
#       - In `files` mode `commit` may be any local commit-ish (e.g. `<fix>^`).
#   * review_mode has EXACTLY ONE of `diff` or `files`:
#       diff  -> {base}: review the change `base..HEAD` (each commit's message + diff).
#                `base` is a ref relative to the checkout; for a single introducing
#                commit it is `HEAD^` (the commit's parent).
#       files -> a list of paths reviewed at `commit`.
#   * Each defect carries: desc (what is wrong), expectation (the criterion the
#     grader matches a review comment against), severity (informative), and a `fix`
#     unless `is_negative: true`.
#   * INTEGRITY: the `defects` (and `source`) are ground truth for the GRADER only —
#     the harness never shows them to the review agent.

- problem_id: 0001-mprotect-merge-unwrap
  commit: 7feb803eaba2a70eb884e7984d4ce11ece5d85f9
  source: >
    PR-derived. Introduced by `7feb803ea` ("Fix cases where some pages are not
    mapped"); fixed by `c7b633e9b`, which replaced the `unwrap` with a `let-else
    continue`. The change under review is the introducing commit itself, fetched
    by full SHA from upstream `main` (no local patch).
  review_mode:
    diff:
      base: HEAD^
  defects:
    - target: { kind: file, path: kernel/src/vm/vmar/vmar_impls/protect.rs }
      persona: development
      grounding: "Reachable panic"
      severity: critical
      desc: >
        The protect loop snapshots the intersecting mappings; for each it skips
        any whose perms already equal the target (`perms == stored & ALL_PERMS`),
        else it `remove`s the entry, protects it, and re-inserts with
        `insert_try_merge`. A merge coalesces an adjacent mapping that has equal
        perms — including a not-yet-processed snapshot entry — removing its B-tree
        key, after which the loop's later `inner.remove(&start).unwrap()` on that
        key panics. It is reachable from userspace: `mprotect` builds `VmPerms`
        via `from_bits_truncate(perms)` without masking to `ALL_PERMS`, so a caller
        can set a `MAY_*` bit (e.g. `mprotect(p, len, PROT_READ | 0x8)`) that
        defeats the perms-equality skip for the absorbed neighbour while still
        letting the merge fire.
      fix: >
        Do not `unwrap()` a `remove` whose key a merge may already have absorbed —
        skip a missing entry with a `let-else`/match (as `c7b633e9b` did) — and
        mask user `prot` to `ALL_PERMS` in `mprotect` so a `MAY_*` bit cannot
        defeat the perms-equality skip.
      expectation: >
        A reviewer should flag the `remove(...).unwrap()` as a reachable panic
        (bonus: the missing prot-bit masking in `mprotect`).

- problem_id: 0002-fair-weight-race
  commit: 4571fabc7a0b8cb34e2cc82fdd7fc2d50a36d0f3
  source: >
    PR-derived. Introduced by `4571fabc7` ("Fix integer overflow due to fair
    weight change"); fixed by `4f772901f`, which serializes updates behind a
    `SpinLock`. The change under review is the introducing commit itself, fetched
    by full SHA from upstream `main` (no local patch).
  review_mode:
    diff:
      base: HEAD^
  defects:
    - target: { kind: file, path: kernel/src/sched/sched_class/fair.rs }
      persona: development
      grounding: careful-atomics
      severity: major
      desc: >
        The change implements weight updates with an ad-hoc lock-free scheme
        across two independent atomics (`weight` with a `HAS_PENDING` bit and
        `pending_weight`) plus a `compare_exchange_weak` loop. The store of
        `pending_weight` and the OR-in of the pending bit are not atomic together,
        so a concurrent update can be lost or a stale `pending_weight` read.
      fix: >
        Replace the ad-hoc multi-atomic protocol with a single atomic word or a
        lock (the fix serializes updates behind a `SpinLock`).
      expectation: >
        A reviewer should flag the multi-word lock-free protocol as unsound and
        ask for a single atomic or a lock.

- problem_id: 0003-semop-timeout-toctou
  commit: c4f3a1b30^
  source: >
    Fix-anchored. `commit` is the parent of the fix `c4f3a1b30`; the TOCTOU
    is present at this snapshot and nothing in the file names it (leak-free). The
    bug postdates a clean introducing commit, so files mode is used instead of a
    patch.
  review_mode:
    files:
      - kernel/src/ipc/semaphore/system_v/sem.rs
  defects:
    - target: { kind: file, path: kernel/src/ipc/semaphore/system_v/sem.rs }
      persona: development
      grounding: atomic-critical-sections
      severity: major
      desc: >
        After the waiter wakes, `sem_op` reloads the operation's status and then
        acts on it in steps that are not atomic with respect to a concurrent
        removal or wakeup: the status it observed can change before it is acted
        upon, so an operation that should have completed is reported as a spurious
        `EAGAIN` (or the pending entry is mishandled).
      fix: >
        Make the post-wait status load and the action it drives atomic —
        re-validate under the sem-set lock before acting (as `c4f3a1b30` does).
      expectation: >
        A reviewer should flag the check-then-act spanning the wait as a race.

- problem_id: 0004-semop-dead-timer-retain
  commit: 6ce50fab1c47a33960861675bb3627e9d9e2fbf8
  source: >
    PR-derived. Introduced by `6ce50fab1` ("Refactor semaphore to support atomic
    semop"); fixed by `11a639f09`. The change under review is the introducing
    commit itself — it carries TWO distinct defects — fetched by full SHA from
    upstream `main` (no local patch).
  review_mode:
    diff:
      base: HEAD^
  defects:
    - target: { kind: file, path: kernel/src/ipc/semaphore/system_v/sem.rs }
      persona: development
      grounding: raii
      severity: critical
      desc: >
        The `JiffiesTimer` created for the timeout is bound to a local that is
        dropped at the end of its scope, so the timer never fires and `semop`
        timeouts are effectively ignored.
      fix: >
        Keep the timer alive across the wait — store the `Arc<Timer>` for the
        duration of `waiter.wait()` (the fix stores it so it outlives the wait).
      expectation: >
        A reviewer should flag the timer/guard that is constructed but never kept
        alive.
    - target: { kind: file, path: kernel/src/ipc/semaphore/system_v/sem.rs }
      persona: development
      grounding: "Over-broad removal"
      severity: major
      desc: >
        Cleanup uses `pending_ops.retain(|op| op.pid != pid)`, which removes ALL
        pending ops for that PID instead of the one specific op, corrupting other
        in-flight operations.
      fix: >
        Match the specific timed-out op by identity, e.g.
        `!Arc::ptr_eq(&op.status, &status)`.
      expectation: >
        A reviewer should flag the over-broad predicate.

- problem_id: 0005-virtio-blk-flush-desc-count
  commit: 32572e22d9d9c7f49826a577484a0c57a6154f1e
  source: >
    PR-derived. Introduced by `32572e22d` ("Implement flush for virtio-blk");
    fixed by `5f6520d99`, which sets the descriptor count to 2. The change under
    review is the introducing commit itself, fetched by full SHA from upstream
    `main` (no local patch).
  review_mode:
    diff:
      base: HEAD^
  defects:
    - target: { kind: file, path: kernel/comps/virtio/src/device/block/device.rs }
      persona: development
      grounding: "Off by one"
      severity: major
      desc: >
        `flush` submits two descriptors (a `req_slice` input and a `resp_slice`
        output) but hardcodes `let num_used_descs = 1;`, so the
        `num_used_descs > queue.available_desc()` guard can pass with only one free
        slot, exhausting the virtqueue.
      fix: >
        Set `num_used_descs = 2` to match the two descriptors enqueued.
      expectation: >
        A reviewer should flag that the descriptor count does not match the number
        of buffers enqueued.

- problem_id: 0006-trapframe-pad-alignment
  commit: f4e29d67c^
  source: >
    Fix-anchored. `commit` is the parent of the fix `f4e29d67c` (which
    restored `_pad` and added the alignment `const_assert!`). Leak-free: at this
    snapshot nothing in the files names the defect.
  review_mode:
    files:
      - ostd/src/arch/x86/trap/mod.rs
      - ostd/src/arch/x86/trap/trap.S
  defects:
    - target: { kind: file, path: ostd/src/arch/x86/trap/mod.rs }
      persona: hardware
      grounding: 16b-align-rsp-before-call
      severity: critical
      desc: >
        `TrapFrame` is not a multiple of 16 bytes, so when the kernel trap path
        materializes one on the stack and `call`s the Rust trap handler, `%rsp` is
        misaligned by 8 at the call boundary, violating the System V AMD64 ABI (UB
        for SSE instructions such as `movaps`).
      fix: >
        Restore the padding so `size_of::<TrapFrame>()` is a multiple of 16, and
        add a `const_assert!` to enforce the invariant.
      expectation: >
        A reviewer should flag the struct's size / stack misalignment against the
        trap-entry path as an ABI/soundness violation — reasoning from the code
        alone, since at this commit no comment or `const_assert!` points at the
        invariant. A matching comment may come from the Hardware persona or from
        the Security persona (as an `unsafe` / soundness hazard).

- problem_id: 0007-getcwd-erange
  commit: 6678565c80bb615b90ba124ce47beb0642738492
  source: >
    Manual. A handcrafted regression of a real historical bug (it predates the
    current crate layout, so it cannot be sourced from its introducing commit):
    the commit reintroduces `getcwd` truncating into an undersized user buffer
    instead of returning `ERANGE`, onto a sound base where `getcwd` is correct. It
    touches only `getcwd.rs` and leaves the regression test in place, so the change
    under review contains no hint of the defect. The commit is synthesized and
    pushed to the fork as a dangling commit; because a fork shares GitHub's object
    store with upstream, it is fetchable by full SHA from upstream too (no local
    patch, no `remote` needed).
  review_mode:
    diff:
      base: HEAD^
  defects:
    - target: { kind: file, path: kernel/src/syscall/getcwd.rs }
      persona: security
      grounding: validate-at-boundaries
      severity: major
      desc: >
        The code clamps the user buffer with `let write_len = len.min(bytes.len())`
        and writes a truncated path, returning the truncated length, instead of
        returning `ERANGE` when the user buffer is too small (the Linux `getcwd`
        contract).
      fix: >
        Return `ERANGE` when `bytes.len() > len` instead of clamping with `min()`
        and truncating.
      expectation: >
        A reviewer should flag that silently clamping a user-supplied length hides
        the "buffer too small" error the syscall must report. A matching comment
        may come from the Security persona or the Development persona (incorrect
        error semantics).

- problem_id: 0008-noncompliant-commit-message
  commit: d4508b8f51a849c1fbb8f5314db49b956a58a60b
  source: >
    Manual. A handcrafted commit whose code change is benign but whose subject
    ("made some changes to getcwd") is vague and past-tense — to exercise
    commit-message review in `diff` mode. Synthesized commit (not from history),
    pushed to the fork as a dangling commit; it is fetchable by full SHA from
    upstream via GitHub's shared fork object store (no local patch, no `remote`
    needed).
  review_mode:
    diff:
      base: HEAD^
  defects:
    - target:
        kind: commit_message
      persona: maintainability
      grounding: imperative-subject
      severity: minor
      desc: >
        The commit subject "made some changes to getcwd" is past-tense and vague:
        it does not summarize *what* the change does in the imperative mood, as
        Asterinas requires. (The code change itself — a clarifying comment — is
        fine; the message is the defect.)
      fix: >
        Rewrite the subject in the imperative mood, naming the actual change, e.g.
        "Document sys_getcwd's user-buffer behavior".
      expectation: >
        A reviewer should flag the non-imperative, non-descriptive subject and ask
        for a specific imperative summary.

- problem_id: 0009-tmpfs-statfs
  commit: 3749ab3327d1f065fadd1f384db31c06c6c7f761
  source: >
    PR-derived. The reviewed change updates `TmpFs::sb` to override tmpfs-visible
    superblock fields and adds helper functions for default tmpfs limits.
    The helpers encode the default capacity policy with an unnamed denominator.
    The change under review is the reviewed commit itself, fetched by full SHA
    from upstream `asterinas/asterinas` (no local patch).
  review_mode:
    diff:
      base: HEAD^
  defects:
    - target: { kind: file, path: kernel/src/fs/fs_impls/tmpfs/fs.rs }
      persona: maintainability
      grounding: no-magic-number
      severity: minor
      desc: >
        The literal `2` encodes the tmpfs default capacity policy in both
        `default_max_blocks` and `default_max_inodes`, but the policy has no
        semantic name, making the "50% of memory" rule easy to miss or
        accidentally change inconsistently.
      fix: >
        Introduce a named constant for the policy and use it in both helpers, for
        example `TMPFS_DEFAULT_CAPACITY_DENOMINATOR`.
      expectation: >
        A reviewer should flag the duplicated literal `2` in the tmpfs default
        block and inode limit helpers as an unnamed capacity policy and ask for a
        named constant.
    - target: { kind: file, path: kernel/src/fs/fs_impls/tmpfs/fs.rs }
      persona: maintainability
      grounding: backtick-identifiers
      severity: minor
      desc: >
        The new `TmpFs::sb` workaround comment names implementation concepts such
        as Tmpfs and RamFs as plain prose instead of formatting those identifiers
        with Markdown backticks, which makes the code-oriented comment
        inconsistent with the local comment style.
      fix: >
        Wrap the code identifiers in backticks in the TODO comment, for example
        using `TmpFs`/`RamFs` consistently where the comment refers to the Rust
        types or filesystem implementation names.
      expectation: >
        A reviewer should flag that the new tmpfs workaround comment leaves
        code identifiers such as `RamFs` unformatted and ask for backticks around
        them.
    - target: { kind: file, path: kernel/src/fs/vfs/path/mod.rs }
      persona: maintainability
      grounding: consistency
      severity: minor
      desc: >
        `Path::fs` is a new public method, but its summary is written as a plain
        `//` comment, so it will not appear in rustdoc with the rest of the
        public `Path` API.
      fix: >
        Change the summary to a rustdoc comment, for example by replacing the
        `//` summary with a `///` summary that documents the returned filesystem.
      expectation: >
        A reviewer should flag that the public `Path::fs` method uses a plain
        `//` summary instead of `///` and ask for a rustdoc comment.

- problem_id: 0100-cmdline-maintainability-issues
  commit: 46bb6b9c58fc3236ea66f8f93fa08fe8744457ae
  source: >
    PR-review-derived. Review comments
    https://github.com/asterinas/asterinas/pull/3010#discussion_r2901089317
    and
    https://github.com/asterinas/asterinas/pull/3010#discussion_r2901089321
    flagged PR commit `46bb6b9c5` ("Add `kernel-parameters` document") for
    declaring the new `inventory` dependency directly in the member crate instead
    of through workspace dependencies, for suppressing `dead_code` across the
    whole cmdline `types` module. The same diff also exposes parsed
    `CpuListSegment` invariants through public fields. The change under review is
    that commit, fetched by full SHA from upstream (no local patch), diffed
    against the supplied base commit `b205cacbf`; the diff adds these
    maintainability defects but contains no note naming them.
  review_mode:
    diff:
      base: b205cacbf5e5406172e5c7216179c2559c091885
  defects:
    - target:
        kind: file
        path: kernel/comps/cmdline/Cargo.toml
        lines: "13"
      persona: maintainability
      grounding: workspace-deps
      severity: minor
      desc: >
        `kernel/comps/cmdline/Cargo.toml` declares `inventory` directly with a
        Git URL and revision. Shared dependencies should be declared once in the
        workspace `[workspace.dependencies]` table and referenced from member
        crates with `.workspace = true`; this is especially important here
        because the same `inventory` crate is already used elsewhere with the
        same source.
      fix: >
        Add `inventory` to the workspace `[workspace.dependencies]` table with
        the shared Git URL/revision, then use `inventory.workspace = true` in
        `kernel/comps/cmdline/Cargo.toml` and any other member crate that depends
        on the same crate.
      expectation: >
        A reviewer should flag the direct `inventory` dependency in the member
        crate and ask for a workspace dependency referenced with
        `inventory.workspace = true`.
    - target:
        kind: file
        path: kernel/comps/cmdline/src/types.rs
        lines: "8"
      persona: maintainability
      grounding: narrow-lint-suppression
      severity: minor
      desc: >
        `kernel/comps/cmdline/src/types.rs` adds `#![allow(dead_code)]` at module
        scope, suppressing `dead_code` for every item in the new `types` module.
        That hides unused-code warnings not only for the currently intentional
        parser helpers, but also for future accidental additions to the module,
        making the lint suppression broader than the code that needs it.
      fix: >
        Narrow the suppression to the specific item or small block that currently
        needs it, preferably with `#[expect(dead_code)]` and a short reason if the
        code is intentionally staged for later use.
      expectation: >
        A reviewer should flag the module-wide `#![allow(dead_code)]` and ask for
        the `dead_code` suppression to be narrowed to the specific item that needs
        it.
    - target:
        kind: file
        path: kernel/comps/cmdline/src/types.rs
        lines: "31"
      persona: maintainability
      grounding: getter-encapsulation
      severity: minor
      desc: >
        `CpuListSegment` exposes `start`, `end`, `stride`, and `group` as public
        fields even though the parser enforces invariants such as `start <= end`,
        nonzero `stride`, and nonzero `group`. Public fields let external code
        construct invalid segments and make the representation part of the API.
      fix: >
        Make the fields private and expose getters, plus a checked constructor if
        external code needs to construct `CpuListSegment` values.
      expectation: >
        A reviewer should flag the public fields on `CpuListSegment` and ask for
        private fields with getters or another checked interface that preserves
        the parser invariants.

- problem_id: 0200-i8042-keyboard-controller-protocol
  commit: 2c4da30fe3dbccef31e92bd940361fb86b4f9f58
  source: >
    PR-derived. PR #2054 added i8042 controller support in `2c4da30fe`; review
    comment `r2158245414` identified that controller I/O is performed without
    checking the status register before reads or writes. This expanded variant
    uses the same reviewed surface and covers three protocol/concurrency defects
    in that diff: the controller error predicate misses single hardware error
    bits, the IRQ input parser reads port `0x60` before checking for available
    data, and the IRQ callback path invokes callbacks while holding an
    IRQ-disabling spinlock. The reviewed surface is that real intermediate
    commit, fetched by full SHA from the default upstream; the later
    wait/send/receive helpers are outside the reviewer input.
  review_mode:
    diff:
      base: HEAD^
  defects:
    - target: { kind: file, path: kernel/comps/keyboard/src/i8042_chip/controller.rs }
      persona: development
      grounding: "Wrong predicate"
      severity: major
      desc: >
        `Status::has_error` uses
        `contains(Self::SYSTEM_FLAG | Self::TIME_OUT_ERROR | Self::PARITY_ERROR)`.
        In `bitflags`, `contains` only returns true when all requested bits are
        set, so a status with only `TIME_OUT_ERROR` or only `PARITY_ERROR` is
        treated as clean. The expression also includes `SYSTEM_FLAG`, which is a
        normal POST/status bit rather than an I/O error bit.
      fix: >
        Check only real error bits and use an any-bit predicate, for example
        `self.intersects(Self::TIME_OUT_ERROR | Self::PARITY_ERROR)`, so either
        hardware error rejects the scancode or controller reply.
      expectation: >
        A reviewer should flag that `Status::has_error` uses `contains` over
        `SYSTEM_FLAG | TIME_OUT_ERROR | PARITY_ERROR`, thereby missing isolated
        timeout or parity errors and mixing a normal status bit into error
        detection.
    - target: { kind: file, path: kernel/comps/keyboard/src/i8042_chip/keyboard.rs }
      persona: development
      grounding: "Invalid read"
      severity: major
      desc: >
        `parse_inputkey` reads `DATA_PORT` before checking
        `status.has_data_to_read()`. On a spurious IRQ1 or any interrupt where
        the i8042 output buffer is empty, the code reads port `0x60` first and
        only then notices that no data was available, consuming an undefined or
        stale byte before returning `InputKey::Ign`.
      fix: >
        Read the status register first. Return before touching `DATA_PORT` when
        the output buffer is empty or the status reports an error, then read the
        scan code and validate the scan-code error value.
      expectation: >
        A reviewer should flag that the IRQ parser reads from port `0x60` before
        checking `OUTPUT_BUFFER_IS_FULL` and should require the output-buffer
        status check to happen before `ScanCode::read`.
    - target: { kind: file, path: kernel/comps/keyboard/src/i8042_chip/keyboard.rs }
      persona: development
      grounding: no-io-under-spinlock
      severity: major
      desc: >
        `handle_keyboard_input` iterates `KEYBOARD_CALLBACKS.lock().iter()` and
        invokes arbitrary callbacks while holding the callback-list spinlock with
        local IRQs disabled. The registered framebuffer callback can enter the
        TTY path and echo input back through `FramebufferConsole::send`, so
        framebuffer/console work can run while the keyboard callback spinlock is
        held in interrupt context.
      fix: >
        Do not call keyboard callbacks while holding the callback-list spinlock.
        Store callbacks in an RCU/snapshot-friendly structure, or copy stable
        callback references out under the lock, drop the guard, and then invoke
        the callbacks.
      expectation: >
        A reviewer should flag that the keyboard IRQ handler invokes callbacks
        under `KEYBOARD_CALLBACKS`'s IRQ-disabling spinlock and require callback
        dispatch to happen after releasing that lock.

- problem_id: 0300-file-cap-setuid-root-effective
  commit: f5fc357bbb33de3e2667f217572e65d4bd6fe7e8
  source: >
    PR-review-derived. Review comments
    https://github.com/asterinas/asterinas/pull/3365#discussion_r3458393524
    and
    https://github.com/asterinas/asterinas/pull/3365#discussion_r3459392413
    flagged PR commit `f5fc357b` for deriving exec-time capability sets from a
    setuid-root transition even when file capabilities are present, and for
    loading `security.capability` through a normal readable-file xattr path.
    The current branch also computes capability sets from one executable
    metadata snapshot and later applies setuid/setgid from a fresh metadata
    read. The change under review is that
    original PR commit, fetched by full SHA from upstream; the diff adds these
    security defects but contains no later corrected condition or regression test
    naming them.
  review_mode:
    diff:
      base: HEAD^
  defects:
    - target: { kind: file, path: kernel/src/process/credentials/credentials_.rs }
      persona: security
      grounding: "Privilege escalation"
      severity: critical
      desc: >
        `calculate_capsets_for_exec` computes `file_effective` with `(!no_root
        && exec_euid.is_root()) || file_capabilities.has_effective_flag()`.
        That grants a full effective capability set whenever exec makes the
        effective UID root, even if the executable also carries file
        capabilities. Linux treats the setuid-root plus file-capability case
        specially: for a non-root caller executing such a file, the file
        capabilities suppress the legacy setuid-root full-capability grant,
        and only the file-capability effective flag should make the permitted
        set effective.
      fix: >
        Base `file_effective` on the same root-special-case predicate used for
        the permitted and inheritable file sets, so `exec_euid == 0` grants
        full effective capabilities only when the legacy root rule actually
        applies. If file capabilities are present for a non-root caller, use
        the xattr effective flag to decide whether the resulting permitted set
        becomes effective.
      expectation: >
        A reviewer should flag that setuid-root must not grant a full
        effective capability set when file capabilities are present for a
        non-root caller; only the file effective flag should make the
        permitted set effective.
    - target: { kind: file, path: kernel/src/process/credentials/file_capabilities.rs }
      persona: security
      grounding: "Incorrect permission check"
      severity: major
      desc: >
        `FileCapabilities::read_from_inode` now calls `inode.get_xattr(...)`
        to read `security.capability`. The filesystem `Inode::get_xattr`
        implementations, such as ext2, perform a normal `MAY_READ` DAC check
        before looking up the xattr. That check is inappropriate for exec-time
        file-capability loading: a file can be executable without being
        readable, for example mode `0111`, and an execute-only file with no
        `security.capability` xattr should execute normally. With the new
        path, the read permission check returns `EACCES` before the xattr
        lookup can return `ENODATA`, so `execve` rejects such programs.
      fix: >
        Keep exec-time file-capability lookup on a permission-bypassing xattr
        path, or provide an internal helper that reads `security.capability`
        without applying the caller's ordinary file read permission check.
        Continue treating `ENODATA` and `EOPNOTSUPP` as absence of file
        capabilities.
      expectation: >
        A reviewer should flag that loading `security.capability` during
        `execve` must not require the executable to be readable; execute-only
        files without file capabilities must reach the xattr absence case and
        execute successfully.
    - target: { kind: file, path: kernel/src/process/execve.rs }
      persona: security
      grounding: "TOCTOU race"
      severity: major
      desc: >
        `do_execve` computes `exec_euid` from `elf_file.mode()` and
        `elf_file.owner()` before the irreversible exec phase, and
        `prepare_capsets_for_exec` turns that value into cached
        `ExecCapSets`. Later, `apply_caps_from_exec` calls
        `set_uid_from_elf` and `set_gid_from_elf`, which re-read the inode
        mode, owner, and group before installing the already-computed
        capability sets. If the executable metadata changes between these
        reads, the final effective UID/GID and the installed capability sets
        can be derived from different file states.
      fix: >
        Use one consistent executable metadata snapshot for both the
        setuid/setgid credential transition and capability calculation, or
        recompute the final capability sets after applying the actual UID/GID
        changes that will be committed. The pre-irreversible phase may still
        validate file-capability failures, but the no-return phase must not
        install capability sets derived from stale mode/owner metadata.
      expectation: >
        A reviewer should flag that exec capability sets are prepared from one
        executable mode/owner snapshot while the setuid/setgid transition later
        re-reads inode metadata, so concurrent metadata changes can make the
        installed capabilities inconsistent with the final credentials.

- problem_id: 0301-rt-sigprocmask-unblockable-signals
  commit: 2154124dc46a5e2a1d768ed67dfbe5655da9987a
  source: >
    PR-body-derived from PR #2288
    `https://github.com/asterinas/asterinas/pull/2288#issue-3268551599`. The
    PR fixes `rt_sigprocmask` so user space cannot block `SIGKILL` or
    `SIGSTOP`. Files mode uses `2154124dc46a5e2a1d768ed67dfbe5655da9987a`, the
    parent of mainline fixing commit `8a801676ab2f827e1d6e4d1ec6803261b5e7859c`,
    because it is the newest buggy snapshot before the `SetMask` branch starts
    filtering unblockable signals. The same snapshot also decodes `how` before
    checking whether the user supplied a new mask, and exposes the syscall-local
    `MaskOp` decode enum unnecessarily.
  review_mode:
    files:
      - kernel/src/syscall/rt_sigprocmask.rs
  defects:
    - target: { kind: file, path: kernel/src/syscall/rt_sigprocmask.rs }
      persona: development
      grounding: "Incorrect signal semantics"
      severity: critical
      desc: >
        `sys_rt_sigprocmask` sanitizes `read_mask` for `MaskOp::Block`, but
        the `MaskOp::SetMask` arm stores the user-provided mask verbatim with
        `sig_mask_ref.store(read_mask, Ordering::Relaxed)`. A caller using
        `SIG_SETMASK` can therefore place `SIGKILL` or `SIGSTOP` in the
        thread's blocked signal mask. Linux requires attempts to block these
        two signals to be silently ignored, so accepting them in the set-mask
        path can make user tasks unkillable or unstoppable and breaks signal
        semantics.
      fix: >
        Remove `SIGKILL` and `SIGSTOP` from the mask before storing it in the
        `MaskOp::SetMask` branch. The operation should still return success,
        matching Linux's silently-ignore behavior for attempts to block these
        signals.
      expectation: >
        A reviewer should flag that every path installing a blocked signal
        mask, including `SIG_SETMASK`, must preserve the invariant that
        `SIGKILL` and `SIGSTOP` cannot be blocked.
    - target: { kind: file, path: kernel/src/syscall/rt_sigprocmask.rs }
      persona: development
      grounding: "Incorrect argument validation"
      severity: major
      desc: >
        `sys_rt_sigprocmask` converts `how` with `MaskOp::try_from(how)?`
        before it checks whether `set_ptr` is null. Linux ignores the `how`
        argument when `set` is `NULL`, because that call only reads the current
        signal mask through `oldset`. A call such as
        `rt_sigprocmask(999, NULL, oldset, 8)` should therefore succeed and
        report the old mask, but this implementation returns `EINVAL` before
        it reaches the `oldset_ptr` write.
      fix: >
        Delay converting `how` to `MaskOp` until the `set_ptr != 0` path, or
        pass an `Option<MaskOp>` into the helper so the read-only
        `set_ptr == 0` case writes `oldset` without validating `how`.
      expectation: >
        A reviewer should flag that `rt_sigprocmask` must ignore invalid
        `how` values when `set` is `NULL`; only calls that install or change a
        signal mask should validate the operation.
    - target: { kind: file, path: kernel/src/syscall/rt_sigprocmask.rs }
      persona: maintainability
      grounding: narrow-visibility
      severity: minor
      desc: >
        `MaskOp` is declared `pub`, but it is only used inside
        `kernel/src/syscall/rt_sigprocmask.rs` to decode the syscall's `how`
        argument. Exposing this syscall-local enum creates an unnecessary
        module interface for an implementation detail that no other module
        needs to name.
      fix: >
        Make `MaskOp` private unless another module actually needs to use the
        enum type directly.
      expectation: >
        A reviewer should flag that syscall-local decode enums should not be
        public when all uses are contained in the same source file.

- problem_id: 0400-ci-false-seqpacket-zero-pause-race
  commit: c6a6e66aaca9635e36d99e47ed87edd6d4b69f87
  source: >
    PR-derived from https://github.com/asterinas/asterinas/pull/2290. Files mode
    uses the PR base commit `c6a6e66aaca9635e36d99e47ed87edd6d4b69f87`, where
    all three defects are present before PR commits `84d5265a1`, `9004fb490`,
    and `f946894d2` fix them. This snapshot contains the buggy CI expressions,
    the `SOCK_SEQPACKET` debug assertion, and the `pause_timeout` signal-wait
    race, but does not include the PR description or fix commits that name the
    defects, so the reviewed files are leak-free.
  review_mode:
    files:
      - .github/workflows/test_x86.yml
      - kernel/src/net/socket/unix/stream/connected.rs
      - kernel/src/process/signal/pause.rs
  defects:
    - target:
        kind: file
        path: .github/workflows/test_x86.yml
        lines: "84-100"
      persona: development
      grounding: "Preserve explicit false configuration values"
      severity: major
      desc: >
        The workflow passes `release` and `enable_kvm` to the test action with
        `${{ matrix.release || true }}` and `${{ matrix.enable_kvm || true }}`.
        In GitHub Actions expressions, an explicit boolean `false` is falsy, so
        `false || true` evaluates to `true`. Matrix entries that deliberately set
        `release: false` for debug builds or `enable_kvm: false` for non-KVM
        runs are therefore silently converted back to enabled/release runs, and
        CI does not execute the configuration declared by the matrix.
      fix: >
        Preserve the distinction between an omitted value and an explicit
        `false` at both test-action call sites. The PR fix uses
        `${{ !contains(matrix.release, 'false') }}` and
        `${{ !contains(matrix.enable_kvm, 'false') }}` so omitted values default
        to true while explicit false values reach the action.
      expectation: >
        A reviewer should flag that the `|| true` fallback overwrites explicit
        `false` values for `release` and `enable_kvm`, preventing debug and
        KVM-disabled CI jobs from actually running as requested.

    - target:
        kind: file
        path: kernel/src/net/socket/unix/stream/connected.rs
        lines: "202"
      persona: development
      grounding: "Allow legal zero-length SOCK_SEQPACKET messages"
      severity: major
      desc: >
        `Connected::try_read` permits zero-length reads for `SOCK_SEQPACKET`, but
        the final invariant is `debug_assert!(is_empty || read_tot_len != 0)`.
        `is_empty` describes the caller's receive buffer, not whether the socket
        type allows zero-length packets. A valid empty `SOCK_SEQPACKET` message
        can therefore reach this assertion with `is_empty == false` and
        `read_tot_len == 0`, causing a deterministic debug-build panic instead
        of accepting the legal packet.
      fix: >
        Encode the protocol exception in the assertion by changing it to
        `debug_assert!(is_seqpacket || read_tot_len != 0)`, or otherwise allow
        zero-length `SOCK_SEQPACKET` messages without panicking.
      expectation: >
        A reviewer should flag that the assertion rejects legal zero-length
        `SOCK_SEQPACKET` receives and ask for the invariant to be based on
        `is_seqpacket` or an equivalent protocol-aware condition.

    - target:
        kind: file
        path: kernel/src/process/signal/pause.rs
        lines: "152-175"
      persona: development
      grounding: "Close the signal-registration to wait race"
      severity: major
      desc: >
        `Waiter::pause_timeout` installs the POSIX signal waker and then calls
        `self.wait()`, but it only checks `posix_thread.has_pending()` after
        the wait returns. If a signal is already pending before the waker is
        installed, no later signal wakeup is guaranteed, so `self.wait()` may
        sleep until the timeout or an unrelated wakeup. For calls such as
        `ppoll`, this can turn a pending `SIGINT` into a timeout instead of
        returning `EINTR`.
      fix: >
        After `set_signalled_waker`, recheck `posix_thread.has_pending()` before
        entering `self.wait()`. If a signal is pending, clear the registered
        waker and return `EINTR`; otherwise wait and clear the waker after the
        wait returns.
      expectation: >
        A reviewer should flag the lost-wakeup race between registering the
        signal waker and blocking, and require a pending-signal recheck plus
        waker cleanup on the early-return path.

- problem_id: 0401-getrandom-boundary-semantics
  commit: b606e3456c43924f4b465900b51e2349a554c0df
  source: >
    PR-derived from https://github.com/asterinas/asterinas/pull/2482. The PR
    description explicitly identifies three `getrandom` defects in the base
    implementation: invalid flags are not rejected, a user-controlled `count`
    drives an unbounded kernel allocation, and short writes are not allowed.
    The fixing commit is `933f7494deca558c198e712d284d18d9e12835f7`
    (`Fix some `getrandom` behavior`). Files mode checks PR base commit
    `b606e3456c43924f4b465900b51e2349a554c0df`, whose `getrandom.rs` matches
    the PR body's linked snapshot `294c55d0dfa5e5784729548f9764b26e608c18ff`
    for this file. The reviewed file contains no PR description or fix code, so
    the defects are leak-free.
  review_mode:
    files:
      - kernel/src/syscall/getrandom.rs
  defects:
    - target:
        kind: file
        path: kernel/src/syscall/getrandom.rs
        lines: "6-8"
      persona: security
      grounding: "invalid flags"
      severity: major
      desc: >
        `sys_getrandom` parses user-supplied flags with
        `GetRandomFlags::from_bits_truncate(flags)`. Unknown bits are silently
        discarded instead of being rejected. A syscall boundary must validate
        user-controlled flags before trusting them internally; otherwise
        callers can pass invalid flag combinations and receive success for a
        request Linux would reject with `EINVAL`.
      fix: >
        Parse with `GetRandomFlags::from_bits(flags)` and return `EINVAL` when
        it returns `None`. Also reject invalid known combinations
        such as `GRND_INSECURE | GRND_RANDOM`.
      expectation: >
        A reviewer should flag `from_bits_truncate` at the syscall boundary and
        require invalid `getrandom` flags, including unsupported bits, to be
        rejected instead of masked away.

    - target:
        kind: file
        path: kernel/src/syscall/getrandom.rs
        lines: "12-18"
      persona: security
      grounding: "unbounded allocation"
      severity: major
      desc: >
        The syscall allocates `vec![0u8; count]` directly from the
        user-controlled `count` argument. There is no upper bound or streaming
        through the user buffer, so a large `count` can force an unbounded kernel
        allocation and panic or exhaust memory. User-supplied sizes must be
        validated at syscall boundaries before being used to allocate kernel
        memory.
      fix: >
        Avoid allocating a kernel buffer sized by `count`. Create a bounded
        userspace writer with `ctx.user_space().writer(buf, count)?` and pass it
        to the random device so bytes are generated directly into userspace.
      expectation: >
        A reviewer should flag the `vec![0u8; count]` allocation as unbounded
        allocation from a user-controlled syscall argument and require bounded
        validation or direct streaming to the user writer.

    - target:
        kind: file
        path: kernel/src/syscall/getrandom.rs
        lines: "14-22"
      persona: maintainability
      grounding: "short writes are not allowed"
      severity: minor
      desc: >
        The implementation first fills a kernel buffer, records `read_len`, and
        then writes the entire `buffer.as_slice()` of length `count` to
        userspace with `write_bytes`. If only part of the requested user buffer
        can be written, this full-buffer write turns the operation into an error
        instead of returning the number of bytes already produced. The PR
        identifies that `getrandom` should permit short writes; therefore the
        user buffer must be represented by a writer whose partial progress is
        visible to the random device.
      fix: >
        Replace the intermediate full-size kernel buffer and final full
        `write_bytes` call with `ctx.user_space().writer(buf, count)?`, then let
        `device::Random::getrandom` or `device::Urandom::getrandom` write
        directly into that writer and return the actual byte count.
      expectation: >
        A reviewer should flag that writing the whole `count`-sized buffer after
        generating `read_len` bytes prevents valid short-write behavior and ask
        for direct userspace-writer based copying that reports actual progress.

- problem_id: 0402-clone-reaper-defects
  commit: 702aa7d9eeffec033aff33769c2fd5cc75984262
  source: >
    PR-derived from https://github.com/asterinas/asterinas/pull/2477. The PR
    description explicitly identifies five defects: a clone-flag check in the
    wrong layer, incomplete `CloneArgs::check` validation, incomplete
    `clone3()` stack validation, a `find_reaper_process` race, and incorrect
    memory orderings for subreaper state. The final PR commit additionally
    fixes the `set_child_tid` invalid-address panic, as stated by its commit
    message `Don't panic if `set_child_tid` is invalid`. The reviewed snapshot
    is the PR base commit `702aa7d9eeffec033aff33769c2fd5cc75984262`, before
    all three PR commits. The snapshot contains no PR description, review
    response, or fix commit, so the defect targets are leak-free.
  review_mode:
    files:
      - kernel/src/process/clone.rs
      - kernel/src/syscall/clone.rs
      - kernel/src/process/exit.rs
      - kernel/src/process/process/mod.rs
      - kernel/src/thread/task.rs
  defects:
    - target:
        kind: file
        path: kernel/src/process/clone.rs
        lines: "132-137"
      persona: security
      grounding: "wrong location for `CLONE_FS` and `CLONE_NEWNS` checks"
      severity: major
      desc: >
        The `CLONE_FS` and `CLONE_NEWNS` incompatibility check is placed in
        `CloneArgs::for_clone`, which is only used by the legacy `clone`
        syscall. Both `clone` and `clone3` call `clone_child`, and
        `clone_child` invokes the common `CloneArgs::check`, but `clone3`
        constructs `CloneArgs` through `TryFrom<Clone3Args>` and bypasses
        `for_clone`. Consequently, invalid `clone3` flag combinations can reach
        the common clone implementation without this required validation.
      fix: >
        Remove the check from `CloneArgs::for_clone` and perform it in
        `CloneArgs::check`, which is called by `clone_child` for both
        `clone` and `clone3`.
      expectation: >
        A reviewer should identify that validation in `for_clone` is not shared
        by `clone3` and require the `CLONE_FS`/namespace compatibility check to
        live in the common `CloneArgs::check` path.

    - target:
        kind: file
        path: kernel/src/process/clone.rs
        lines: "185-225"
      persona: security
      grounding: "incomplete `CloneArgs::check`"
      severity: major
      desc: >
        `CloneArgs::check` validates `CLONE_VM` and `CLONE_SIGHAND` only inside
        the `CLONE_THREAD` branch. It therefore accepts `CLONE_SIGHAND` without
        `CLONE_VM`, although the Linux clone contract requires
        `CLONE_VM` whenever `CLONE_SIGHAND` is specified. This invalid flag
        combination is not rejected for either clone entry point once the
        common check is reached.
      fix: >
        Add an independent check that returns `EINVAL` when
        `CLONE_SIGHAND` is set without `CLONE_VM`.
      expectation: >
        A reviewer should flag the missing unconditional dependency check and
        require `CLONE_SIGHAND` without `CLONE_VM` to be rejected with
        `EINVAL`.

    - target:
        kind: file
        path: kernel/src/syscall/clone.rs
        lines: "84-124"
      persona: security
      grounding: "clone3() performs some additional checks"
      severity: major
      desc: >
        `TryFrom<Clone3Args>` converts `value.stack` directly and only converts
        `value.stack_size` to `Option<NonZeroU64>`. It accepts exactly one of
        the stack address and stack size, and it does not verify that the stack
        range lies in userspace. `clone3` can therefore pass an incomplete or
        invalid stack description into later child-context setup instead of
        returning `EINVAL`.
      fix: >
        Treat stack and stack size as a pair: reject cases where exactly one is
        nonzero, and when both are present validate the start and inclusive end
        addresses with `is_userspace_vaddr`.
      expectation: >
        A reviewer should flag the missing `clone3` stack validation and require
        `EINVAL` for a stack address without size, a size without address, or a
        stack range outside userspace.

    - target:
        kind: file
        path: kernel/src/process/exit.rs
        lines: "49-73"
      persona: development
      grounding: "race condition in find_reaper_process implementation"
      severity: major
      desc: >
        `find_reaper_process` keeps the current ancestor as a weak reference and
        walks upward by upgrading each parent. If the parent and grandparent
        exit and are reaped concurrently, the grandparent upgrade can fail.
        The loop then terminates and returns `None`, even though a current
        parent chain may still identify the correct reaper. The caller then
        falls back to adopting children into init, which is incorrect for this
        race.
      fix: >
        Retain an upgraded parent `Arc`, upgrade the next ancestor separately,
        and retry from `current_process.parent()` when the parent and
        grandparent disappear concurrently.
      expectation: >
        A reviewer should flag that a transient failed weak upgrade is treated
        as proof that no reaper exists and require retry logic for concurrent
        parent/grandparent exit and reaping.

    - target:
        kind: file
        path: kernel/src/thread/task.rs
        lines: "54-62"
      persona: development
      grounding: "do not unwrap user-memory writes after a range-only pointer check"
      severity: major
      desc: >
        Child startup checks only that `set_child_tid` is numerically within the
        userspace virtual-address range, then calls `write_val(...).unwrap()`.
        An address can be in that range but unmapped or unwritable, causing the
        user-memory write to return an error and the child task to panic. This
        is a user-controlled invalid pointer reaching a kernel `unwrap`.
      fix: >
        Attempt the `set_child_tid` write but ignore or otherwise handle its
        error without panicking, such as `let _ = current_userspace!().write_val(...)`.
      expectation: >
        A reviewer should flag the reachable `unwrap()` after only a virtual
        address-range check and require invalid or unwritable `set_child_tid`
        addresses to be handled without a kernel panic.

- problem_id: 0403-madvise-nohugepage-capget-query-openat-empty
  commit: 3b0666449f8f4dc68e339cb7ee0646b45bf21fb1
  source: >
    PR-derived from https://github.com/asterinas/asterinas/pull/2390. The PR
    description explicitly identifies three Podman-related issues, and each is
    fixed by one of the three commits in the PR. Files mode checks the PR base
    commit `3b0666449f8f4dc68e339cb7ee0646b45bf21fb1`, before those fixes. The
    reviewed files contain the defects but no PR description, review response,
    or fix commit, so the targets are leak-free.
  review_mode:
    files:
      - kernel/src/syscall/madvise.rs
      - kernel/src/syscall/capget.rs
      - kernel/src/syscall/open.rs
  defects:
    - target:
        kind: file
        path: kernel/src/syscall/madvise.rs
        lines: "35-50"
      persona: development
      grounding: "unsupported MADV behavior must not panic"
      severity: major
      desc: >
        `MadviseBehavior` defines `MADV_NOHUGEPAGE`, but the match in
        `sys_madvise` has no arm for it. The value therefore reaches the
        catch-all `_ => todo!()` branch. A Podman call using
        `madvise(..., MADV_NOHUGEPAGE)` causes a kernel panic even though this
        Asterinas build does not support huge pages and can safely treat the
        advice as a no-op.
      fix: >
        Add an explicit `MADV_NOHUGEPAGE` arm that emits a warning and returns
        success without changing mappings. Do not route this
        recognized but unsupported advice through `todo!()`.
      expectation: >
        A reviewer should flag the reachable `todo!()` panic for the declared
        `MADV_NOHUGEPAGE` value and require a non-panicking unsupported-operation
        behavior, such as warning and returning success.

    - target:
        kind: file
        path: kernel/src/syscall/capget.rs
        lines: "20-49"
      persona: development
      grounding: "match capget version negotiation and null-data semantics"
      severity: major
      desc: >
        `sys_capget` immediately returns `EINVAL` when the requested capability
        version is unsupported, without writing
        `LINUX_CAPABILITY_VERSION_3` back through the header pointer. It also
        unconditionally writes the capability result to `cap_user_data_addr`,
        so a null data pointer cannot return success. The Linux capget contract
        uses an unsupported-version call to report the supported version, and
        permits a null data pointer for the version-query case. The base
        implementation therefore breaks Podman's capability probing protocol.
      fix: >
        When the header version is unsupported, write
        `LINUX_CAPABILITY_VERSION_3` to the header and return success if
        `cap_user_data_addr == 0`; otherwise return `EINVAL`. Also return
        success early when the supported version is used with a null data
        pointer, before attempting to write capability data.
      expectation: >
        A reviewer should flag both missing parts of the version-query contract:
        the supported version must be written back on an unsupported request,
        and a null data pointer must not be dereferenced or rejected when the
        call is only querying the ABI version.

    - target:
        kind: file
        path: kernel/src/syscall/open.rs
        lines: "21-40"
      persona: development
      grounding: "reject empty pathname for openat"
      severity: major
      desc: >
        `sys_openat` reads the pathname and passes it directly to
        `FsPath::new` and the resolver. With an empty pathname, it does not
        return the required `ENOENT` error at the syscall boundary and instead
        relies on lower-level path handling, which does not provide the Linux
        `openat` behavior expected by Podman. `openat` has no
        `AT_EMPTY_PATH` option that would make an empty pathname valid.
      fix: >
        Check `path.is_empty()` immediately after reading and logging the
        pathname, then return `ENOENT` before constructing `FsPath`.
      expectation: >
        A reviewer should flag that an empty pathname reaches generic path
        resolution and require `sys_openat` to return `ENOENT` explicitly before
        resolution.

- problem_id: 0404-read-cstring-init-stack-defects
  commit: 329c12aaa8cecae8e3de54fc93af07060fade406
  source: >
    PR 2430 introduced the new ReadCString APIs and changed init-stack string
    parsing in commit 329c12aaa8cecae8e3de54fc93af07060fade406. Two GitHub
    review comments identify independent defects in that same change. Comment
    points out that using Vec::with_capacity(max_len) can allocate too much
    memory before reading short strings; follow-up comment confirms the threshold
    approach, and final PR head ea60866 caps the initial capacity with INIT_ALLOC_SIZE.
    Comment identifies a netlink route attribute parser that stops at an
    embedded nul before consuming the full attribute payload; the same comment
    notes that Linux does not require a nul terminator there and that parse
    errors must be reported to userspace. The final PR adds
    read_cstring_until_end(...) and FullRead to preserve reader position and
    propagate recoverable netlink parse errors.
  review_mode:
    diff:
      base: 46aa437c8738e72a47510e764cb2b6eed8032706
  defects:
    - target:
        kind: file
        path: kernel/src/util/read_cstring.rs
      persona: development
      grounding: "avoid unnecessary large heap allocation from caller-provided limits"
      severity: minor
      desc: >
        The new ReadCString implementation uses Vec::with_capacity(max_len)
        before reading any byte. max_len is a caller-provided upper bound, not
        the expected string length, so common short strings with a large bound
        can trigger avoidable large heap allocations or allocation failures.
      fix: >
        Use a small initial capacity capped by max_len, and let Vec grow only if
        the actual string requires it. The final PR uses INIT_ALLOC_SIZE.min(max_len).
      expectation: >
        A valid review must point out that preallocating max_len is too large
        for a C-string reader because max_len is only a limit; it should suggest
        using min(self.remain(), max_len), a threshold, or another capped initial
        capacity to avoid unnecessary allocation.
    - target:
        kind: file
        path: kernel/src/net/socket/netlink/route/message/attr/addr.rs
      persona: development
      grounding: "consume the complete netlink attribute payload"
      severity: major
      desc: >
        The route address attribute parser uses a NUL-terminated C-string read
        for a fixed-length netlink attribute payload. If the reader encounters
        a NUL byte in the middle of the payload, it stops there and returns the
        string while leaving the reader cursor before the end of the attribute.
        The next attribute is then parsed from the wrong position.
      fix: >
        Read through the complete attribute payload with
        read_cstring_until_end, which accepts a missing NUL terminator and
        consumes the remaining bytes. Return a FullRead result so malformed
        attributes are skipped or reported while the caller remains positioned
        at the next attribute boundary.
      expectation: >
        A valid review must identify the cursor-position bug caused by stopping
        at an embedded NUL. It must require consuming or skipping the entire
        attribute payload, must not require a NUL terminator where Linux does
        not, and must preserve parse errors in the netlink response path.

- problem_id: 0405-named-pipe-open-nonblock-status-flags
  commit: 7e7ba43cdfc572cd2ddeecc86a5951bbd200d692
  source: >
    PR 2434 fixes three named-pipe defects present before the PR: FIFO open
    does not wait for the peer endpoint, read/write cannot honor each fd's
    O_NONBLOCK flag, and named-pipe status flags are not per-fd. The PR body
    states these three issues directly, and final head
    66194a964af102206886424bd1840af5c2c197a6 refactors NamedPipe into
    per-open handles to fix them.
  review_mode:
    files:
      - kernel/src/fs/named_pipe.rs
      - kernel/src/fs/ramfs/fs.rs
      - kernel/src/fs/path/mod.rs
      - kernel/src/fs/pipe.rs
      - kernel/src/fs/inode_handle/mod.rs
  defects:
    - target:
        kind: file
        path: kernel/src/fs/named_pipe.rs
        lines: "14-45"
      persona: development
      grounding: "FIFO open must block until the peer endpoint is present"
      severity: major
      desc: >
        FIFO open currently returns in blocking mode even when the peer endpoint
        is absent. A blocking open(O_RDONLY) should wait until a writer opens
        the FIFO, and a blocking open(O_WRONLY) should wait until a reader opens
        it.
      fix: >
        Implement FIFO open semantics by checking the requested access mode and
        coordinating with peer endpoint presence during open. Blocking
        single-ended opens should wait for the opposite endpoint; nonblocking
        and O_RDWR behavior should follow Linux FIFO semantics.
      expectation: >
        A valid review must say that FIFO open semantics are wrong because open
        returns before both read and write ends are present in blocking mode; it
        should request blocking in open based on access mode and peer presence.
    - target:
        kind: file
        path: kernel/src/fs/ramfs/fs.rs
        lines: "552-600"
      persona: development
      grounding: "named-pipe read/write ignore the fd's O_NONBLOCK flag"
      severity: major
      desc: >
        RamFS dispatches NamedPipe read/write directly to the shared
        NamedPipe object. NamedPipe::read and NamedPipe::write take no
        StatusFlags, and InodeHandle::read/write do not pass their per-fd
        status_flags into FileLike/FileIo. As a result, read/write behavior is
        determined by the shared pipe endpoints, not by the file descriptor that
        issued the operation, so O_NONBLOCK on a FIFO fd is not reliably honored.
      fix: >
        Route named-pipe I/O through a FileIo handle whose read/write methods
        receive the current InodeHandle status_flags, and choose try_read/try_write
        for O_NONBLOCK or wait_events for blocking descriptors.
      expectation: >
        A valid review must identify that named-pipe read/write need access to
        the caller fd's status_flags; otherwise O_NONBLOCK cannot control whether
        the operation returns EAGAIN or blocks.
    - target:
        kind: file
        path: kernel/src/fs/pipe.rs
        lines: "50-123,158-234"
      persona: development
      grounding: "status_flags must be per file descriptor, not shared by the pipe object"
      severity: major
      desc: >
        PipeReader and PipeWriter each store status_flags inside the shared pipe
        endpoint object. A FIFO inode has one shared NamedPipe with shared reader
        and writer endpoints, while each open fd has its own InodeHandle
        status_flags. If two descriptors open the same FIFO with different flags,
        such as one blocking reader and one nonblocking reader, storing the flag
        on the shared endpoint cannot represent both descriptors correctly.
      fix: >
        Keep status_flags on InodeHandle/per-open handles and pass them into
        named-pipe read/write. Do not store FIFO nonblocking behavior as mutable
        state in the shared PipeReader/PipeWriter object.
      expectation: >
        A valid review must state that status_flags for a named pipe must be
        per-fd; a shared NamedPipe/PipeReader/PipeWriter flag makes descriptors
        interfere with each other and cannot support simultaneous blocking and
        nonblocking opens.

- problem_id: 0406-runqueue-irq-reparent-wakeup
  commit: 56d78ab64965194ad03cb6cde07fd5d98b17129d
  source: >
    PR 2488 fixes two LTP hang causes listed in the PR body: run queues can be
    locked without disabling local IRQs, and reparented dead children do not
    wake the reaper/init process.
  review_mode:
    files:
      - kernel/src/sched/sched_class/mod.rs:396-402
      - ostd/src/task/scheduler/mod.rs:100-108
      - kernel/src/process/exit.rs:99-126
  defects:
    - target:
        kind: file
        path: kernel/src/sched/sched_class/mod.rs
        lines: "396-402"
      persona: development
      grounding: "run queues must be locked with local IRQ disabled"
      severity: critical
      desc: >
        ClassScheduler::nr_queued_and_running locks each run queue with
        rq.lock() while local IRQs remain enabled. The same run queues can be
        touched from the timer IRQ callback registered by enable_preemption_on_cpu.
        If an IRQ fires while the current context holds a run-queue lock, the
        callback can try to lock the same run queue again and deadlock.
      fix: >
        Make the run-queue spinlock require LocalIrqDisabled, or otherwise
        disable local IRQs before every run-queue lock acquisition so task and
        interrupt contexts cannot re-enter the lock on the same CPU.
      expectation: >
        A valid review must identify that run-queue locks are used from IRQ
        callbacks and therefore must always be acquired with local IRQ disabled;
        merely locking the SpinLock is insufficient.
    - target:
        kind: file
        path: kernel/src/process/exit.rs
        lines: "99-126"
      persona: development
      grounding: "wake reaper after moving dead children"
      severity: major
      desc: >
        move_children_to_reaper_process moves children from an exiting process
        to a reaper or init process, but it does not wake the new parent's
        children_wait_queue. If some moved children are already dead, init can
        sleep in wait because no child-death notification is delivered after the
        reparenting. This can cause test hangs when waiting for reaping.
      fix: >
        After move_process_children succeeds, call
        reaper_process.children_wait_queue().wake_all(); do the same for the
        fallback init_process path.
      expectation: >
        A valid review must say that moving children to init/reaper must wake
        that process's child wait queue, otherwise already-dead reparented
        children may never be reaped.

- problem_id: 0408-procfs-bug-fix-defects
  commit: ff021e0b89811c92069950a5a96ef41f9860de0b
  remote: https://github.com/asterinas/asterinas
  source: >
    PR-derived from https://github.com/asterinas/asterinas/pull/2553. The PR
    body explicitly lists five procfs defects in snapshot
    `ff021e0b89811c92069950a5a96ef41f9860de0b`: inconsistent lock order between
    the process table and procfs cached entries, an atomic-mode break from file
    table notifications into procfs cache updates, incorrect `/proc/[pid]`
    results after exec in a non-main thread, stale `/proc/.../fd` results after
    file-table unshare, and stale `/proc/[pid]/task/[tid]` directories after a
    thread exits. The reviewed snapshot is the linked pre-fix snapshot, before
    fixing commits `a1a6660a9c863ded0ab0a5e98eaaaf8020b047fb`,
    `3b039611a77fdeb92d2e5bb4fb9bc63949e07487`, and
    `ecf61b7223528e99ecfadfe5689412ba67623ca6`, so the defect targets are
    leak-free.
  review_mode:
    files:
      - kernel/src/fs/procfs/mod.rs
      - kernel/src/fs/procfs/pid/mod.rs
      - kernel/src/fs/procfs/pid/task/fd.rs
      - kernel/src/fs/procfs/pid/task/mod.rs
      - kernel/src/fs/procfs/pid/task/mountinfo.rs
  defects:
    - target:
        kind: file
        path: kernel/src/fs/procfs/mod.rs
        lines: "139-209"
      persona: development
      grounding: "keep procfs lock order consistent"
      severity: major
      desc: >
        Procfs takes locks in opposite orders for the same shared state.
        `PidEvent::Exit` runs while the process table is locked and then writes
        `cached_children`, so that path is process table -> cached entries. But
        `populate_children` first locks `cached_children` and then iterates
        `process_table::process_table_mut()`, making the order cached entries ->
        process table. Concurrent process exit and `/proc` directory population
        can deadlock.
      fix: >
        Use a single lock order for root procfs process entries. Taking the process
        table before `cached_children` when dynamic PID entries are populated or
        looked up, and by keeping static entries separate from the process-table
        critical section.
      expectation: >
        A reviewer should identify both lock acquisition paths and require the
        process table and procfs cached-entry locks to be acquired in one
        consistent order.

    - target:
        kind: file
        path: kernel/src/fs/procfs/pid/task/fd.rs
        lines: "34-55"
      persona: development
      grounding: "do not call procfs cache observers from file-table spinlocks"
      severity: major
      desc: >
        `/proc/[pid]/fd` registers its procfs inode as a file-table observer.
        File descriptor close paths notify these observers while mutating the
        file table, which is protected by a spin lock; the observer then writes
        `cached_children`, a mutex-backed procfs cache. Taking a mutex from this
        file-table atomic context can break atomic-mode constraints and sleep
        while a spin lock is held.
      fix: >
        Remove the file-table observer mechanism for procfs fd entries. Rebuild
        or validate `/proc/.../fd` cached children by reading the current file
        table from procfs lookup/readdir paths.
      expectation: >
        A reviewer should flag that fd close notifications can enter procfs cache
        mutation while the file table spin lock is held, and require procfs not
        to rely on observer callbacks from that atomic context.

    - target:
        kind: file
        path: kernel/src/fs/procfs/pid/mod.rs
        lines: "29-42"
      persona: development
      grounding: "process-level procfs entries must not pin the old main thread"
      severity: major
      desc: >
        `PidDirOps::new_inode` captures `process_ref.main_thread()` once and
        embeds that thread in the process-level `/proc/[pid]` directory. After a
        non-main thread successfully executes a new program, it becomes the
        process's main thread. Existing `/proc/[pid]` entries such as
        `mountinfo`, `stat`, `status`, and `fd` can still read through the old
        cached thread and report stale or wrong per-thread state.
      fix: >
        Represent process-level procfs entries without a pinned thread, and
        resolve `process_ref.main_thread()` when the file is read or the fd
        directory is populated.
      expectation: >
        A reviewer should identify that process-level procfs state caches the
        main thread too early and require it to resolve the current main thread
        after exec, especially for non-main-thread exec.

    - target:
        kind: file
        path: kernel/src/fs/procfs/pid/task/fd.rs
        lines: "102-131"
      persona: development
      grounding: "procfs fd symlinks must track current file descriptors"
      severity: major
      desc: >
        Each `/proc/[pid]/fd/N` inode stores an `Arc<dyn FileLike>` captured when
        the procfs entry is created. The `/proc/[pid]/fd` directory registers its
        observer only with the file table that exists at that time. If the calling task
        later unshares its file table, a subsequent close and reuse of the same descriptor
        is not reported to procfs. The cached symlink can then continue to refer to the
        old `FileLike` and return the wrong target.
      fix: >
        Store the task identity and numeric file descriptor in the procfs fd
        symlink, not the old `FileLike`. On `read_link`, look up the current file
        descriptor in the current file table and refresh cached fd entries when
        the descriptor disappears or its access mode changes.
      expectation: >
        A reviewer should flag that caching `Arc<dyn FileLike>` makes `/proc/.../fd/N`
        descriptor reuse, and require lookup against the current file table.

    - target:
        kind: file
        path: kernel/src/fs/procfs/pid/task/mod.rs
        lines: "194-206"
      persona: development
      grounding: "remove task procfs dentries on thread exit"
      severity: major
      desc: >
        `/proc/[pid]/task` populates and caches one child directory per live
        thread, but it never registers for thread-exit events and never removes
        cached TID entries. Once a thread exits, a previously populated
        `/proc/[pid]/task/[tid]` directory can remain visible from the cache even
        though the thread no longer exists.
      fix: >
        Register the task directory as an observer of the process task set and
        remove the cached child named by the exiting TID when a `TidEvent::Exit`
        arrives.
      expectation: >
        A reviewer should identify that cached task directories need an invalidation
        path on thread exit and require `/proc/[pid]/task/[tid]` entries to be
        removed when their thread exits.

- problem_id: 0409-sched-syscall-error-defects
  commit: cef527f372afeb78b5648048f7aaa631207e59bc
  remote: https://github.com/asterinas/asterinas
  source: >
    PR-derived from https://github.com/asterinas/asterinas/pull/2575. The PR
    fixes scheduler syscall compatibility bugs in the pre-fix snapshot
    `cef527f372afeb78b5648048f7aaa631207e59bc`: user-memory faults from
    `sched_*` paths were collapsed to `EINVAL`, `sched_setattr` could allocate
    an unbounded buffer from a user-controlled `sched_attr.size`, and
    `sched_getattr` did not implement Linux-compatible size handling for short
    or oversized user buffers. The reviewed snapshot is before fixing commits
    `46a5b037dce367838f31dd9fb52e5337762eb680` and
    `9d9a48be687338b886e4c9b824f95a5d46b1984e`, so the targets are leak-free.
  review_mode:
    files:
      - kernel/src/syscall/sched_getattr.rs
      - kernel/src/syscall/sched_setattr.rs
      - kernel/src/syscall/sched_setparam.rs
      - kernel/src/syscall/sched_setscheduler.rs
      - kernel/src/syscall/sched_getparam.rs
  defects:
    - target:
        kind: file
        path: kernel/src/syscall/sched_setattr.rs
        lines: "15-20"
      persona: development
      grounding: "preserve user-copy fault errors"
      severity: major
      desc: >
        `sys_sched_setattr` maps every failure from
        `read_linux_sched_attr_from_user` to `EINVAL`. That erases real user
        memory faults, so a non-null invalid pointer that should report
        `EFAULT` is returned as `EINVAL`; it also hides compatibility errors
        such as `E2BIG` from oversized `sched_attr` input with non-zero trailing
        bytes.
      fix: >
        Reject a null address with `EINVAL`, then propagate errors from
        `read_linux_sched_attr_from_user` unchanged. The same rule should apply
        to other `sched_*` user-copy paths instead of converting all copy
        failures to `EINVAL`.
      expectation: >
        A reviewer should flag the blanket `map_err(|_| EINVAL)` around a
        user-copy helper and require syscall-visible errors to be preserved.

    - target:
        kind: file
        path: kernel/src/syscall/sched_getattr.rs
        lines: "153-158"
      persona: security
      grounding: "bound user-controlled sched_attr sizes"
      severity: major
      desc: >
        `read_linux_sched_attr_from_user` trusts `attr.size` when computing
        `additional_size` and allocates `vec![0; additional_size]`. A user can
        pass a very large `sched_attr.size`, forcing an unbounded kernel
        allocation before the syscall returns `E2BIG`, which can panic or
        exhaust memory.
      fix: >
        Validate the user size before allocation, accepting only Linux-supported
        sizes from `SCHED_ATTR_SIZE_VER0` through `PAGE_SIZE`. For oversized
        input, write back the kernel struct size and return `E2BIG` without
        allocating a user-controlled buffer.
      expectation: >
        A reviewer should identify the user-controlled allocation and require a
        fixed upper bound before any allocation or trailing-byte scan.

    - target:
        kind: file
        path: kernel/src/syscall/sched_getattr.rs
        lines: "176-187"
      persona: development
      grounding: "implement sched_getattr compatible writeback"
      severity: major
      desc: >
        `write_linux_sched_attr_to_user` accepts any `user_size` and writes only
        `min(sizeof(LinuxSchedAttr), user_size)` bytes. Thus undersized buffers
        such as `SCHED_ATTR_SIZE_VER0 - 1` can succeed instead of returning
        `EINVAL`, and oversized buffers keep stale non-zero bytes after the
        kernel struct instead of being zero-filled as Linux-compatible
        `sched_getattr` expects.
      fix: >
        Reject `user_size < SCHED_ATTR_SIZE_VER0` or `user_size > PAGE_SIZE`
        with `EINVAL`, set `attr.size` to the kernel struct size capped by the
        user size, and use compatible writeback that zero-fills any user buffer
        tail beyond the kernel struct.
      expectation: >
        A reviewer should check both bounds and tail handling for variable-size
        user ABI structures, not only whether the initial struct bytes are
        copied successfully.

- problem_id: 0410-evdev-fixes-defects
  commit: 70eda539dfade526c28d44e6cb60c056c56cc06c
  remote: https://github.com/asterinas/asterinas
  source: >
    PR-derived from https://github.com/asterinas/asterinas/pull/2616. The PR
    body identifies multiple evdev defects in snapshot
    `70eda539dfade526c28d44e6cb60c056c56cc06c`: evdev files reported
    themselves as seekable, read-side counters could become stale after a
    user-copy failure, short read buffers skipped required checks, full buffers
    usually failed to queue `SYN_DROPPED`, opened-file cleanup could deadlock
    against event delivery, and char-device registration could be reached from
    an atomic input-core path. The reviewed snapshot is before the fixing PR
    commits through `ed3416a2530ce9fc1a2bfad9f87786f644584853`, so the
    targets are leak-free.
  review_mode:
    files:
      - kernel/comps/input/src/lib.rs
      - kernel/src/device/evdev/file.rs
      - kernel/src/device/evdev/mod.rs
      - kernel/src/util/ring_buffer.rs
  defects:
    - target:
        kind: file
        path: kernel/src/device/evdev/file.rs
        lines: "249-252"
      persona: development
      grounding: "evdev files are not seekable"
      severity: major
      desc: >
        `EvdevFile::check_seekable` returns `Ok(())`, so `lseek()` on an evdev
        character device can succeed or be treated as supported. Linux evdev
        files are stream-like input files and should reject seeking with
        `ESPIPE`.
      fix: >
        Return `ESPIPE` from `check_seekable` for evdev files
        while keeping `is_offset_aware()` false.
      expectation: >
        A reviewer should flag that evdev must not advertise seek support and
        require the syscall-visible error to be `ESPIPE`.

    - target:
        kind: file
        path: kernel/src/device/evdev/file.rs
        lines: "167-178"
      persona: development
      grounding: "keep evdev counters consistent after consuming an event"
      severity: major
      desc: >
        `process_events` pops an event from the ring buffer, then writes it to
        user memory before decrementing `event_count` and `packet_count`. If
        `writer.write_val` fails after the pop, the event is already consumed
        but the counters still say it is available, leaving poll/read state
        stale and possibly reporting input that can never be read.
      fix: >
        Update packet/count state immediately after a successful pop, before
        the fallible user write. Decrement the packet count before `write_val`.
      expectation: >
        A reviewer should notice that ring-buffer consumption and availability
        counters must be updated atomically with respect to the pop, not after
        a fallible user-memory write.

    - target:
        kind: file
        path: kernel/src/device/evdev/file.rs
        lines: "212-217"
      persona: development
      grounding: "reject too-short evdev read buffers"
      severity: major
      desc: >
        `read_at` returns `Ok(0)` whenever the user buffer cannot hold a full
        `EvdevEvent`. For a nonzero buffer shorter than one event, Linux evdev
        returns `EINVAL`; this early return also bypasses nonblocking packet
        checks that should run before a zero-length read result is accepted.
      fix: >
        Return `EINVAL` when `requested_bytes != 0` but `max_events == 0`, then
        perform the nonblocking packet-availability check before allowing a true
        zero-length read to return `0`.
      expectation: >
        A reviewer should distinguish a real zero-length read from a too-small
        event buffer and require the evdev ABI checks to run in the Linux order.

    - target:
        kind: file
        path: kernel/src/device/evdev/mod.rs
        lines: "145-175"
      persona: development
      grounding: "report dropped input when the evdev buffer is full"
      severity: major
      desc: >
        When `producer.push(timed_event)` fails because the ring buffer is full,
        the code immediately tries to push a `SYN_DROPPED` event into the same
        full buffer. That usually fails too, so readers receive neither the
        dropped notification nor a reliable indication that earlier events were
        lost.
      fix: >
        Detect the almost-full condition before the normal event push, clear or
        make room for stale events while holding the producer side, and queue
        `SYN_DROPPED` before continuing with new input.
      expectation: >
        A reviewer should flag that a recovery path entered only after the
        buffer is already full cannot reliably enqueue `SYN_DROPPED`.

    - target:
        kind: file
        path: kernel/src/device/evdev/mod.rs
        lines: "124-130"
      persona: development
      grounding: "do not drop EvdevFile while holding opened_files"
      severity: major
      desc: >
        `pass_events` holds `opened_files` while upgrading a `Weak<EvdevFile>`
        to a temporary `Arc`. If that temporary is the file's last strong
        reference, dropping it at the end of the loop runs `EvdevFile::drop`,
        which calls `detach_closed_files` and tries to lock `opened_files`
        again. That can deadlock event delivery.
      fix: >
        Do not store weak file handles that need upgrading while the device lock
        is held. Store shared file-inner objects in `opened_files` and remove a
        closed file directly in `Drop` without scanning/upgrading other entries.
      expectation: >
        A reviewer should connect the `Weak::upgrade` lifetime under
        `opened_files` with `EvdevFile::drop`'s cleanup path and require a lock
        design that cannot recursively acquire the same lock.

    - target:
        kind: file
        path: kernel/src/device/evdev/mod.rs
        lines: "262-269"
      persona: development
      grounding: "do not take sleeping locks from input-core atomic context"
      severity: major
      desc: >
        `EvdevHandlerClass::connect` calls `register`, which locks the char
        device registry mutex, and then locks `EVDEV_DEVICES`. But input handler
        `connect` callbacks are invoked while the input core is protected by a
        spin lock. Taking mutex-backed registry locks from that atomic path can
        break atomic-mode constraints.
      fix: >
        Make the input core lock sleepable, as the PR does by changing it from
        `SpinLock<InputCore>` to `Mutex<InputCore>`, or otherwise move evdev
        char-device registration outside the spin-locked input-core path.
      expectation: >
        A reviewer should trace `InputCore::{register_device,register_handler_class}`
        calling `connect` under the input-core lock and reject mutex acquisition
        from a spin-lock/atomic context.

- problem_id: 0411-ext2-super-block-defects
  commit: 34ebccb2e9cb984ae928a7289cb5829e6f335253
  remote: https://github.com/asterinas/asterinas
  source: >
    PR-derived from https://github.com/asterinas/asterinas/pull/2675. The PR
    fixes three ext2 superblock defects in snapshot
    `34ebccb2e9cb984ae928a7289cb5829e6f335253`: the in-memory `SuperBlock`
    did not retain all fields from `RawSuperBlock`, `FsState` was modeled as a
    single enum even though ext2 uses bit flags, and `log_block_size` /
    `log_frag_size` were recalculated incorrectly when writing the superblock
    back. The reviewed snapshot is before fixing commits
    `d6f0b8708eecf0a1b36e62b09cd3de444e021547`,
    `92508c504c4f9ebbbc192b099441f774c647cd9d`, and
    `6cdc784c5b3d1b581c72e9d2d769f7f605c3e3b2`, so the targets are leak-free.
  review_mode:
    files:
      - kernel/src/fs/ext2/super_block.rs
  defects:
    - target:
        kind: file
        path: kernel/src/fs/ext2/super_block.rs
        lines: "531-536"
      persona: development
      grounding: "preserve every on-disk superblock field on writeback"
      severity: major
      desc: >
        `RawSuperBlock::from(&SuperBlock)` writes the known layout fields and
        then fills the remaining raw superblock fields from `Default`. Because
        `SuperBlock` never stored fields such as `min_rev_level`,
        `algorithm_usage_bitmap`, journal metadata, hash seed, mount options,
        `first_meta_bg`, and the reserved tail, any superblock read and later
        written back silently zeroes that on-disk information.
      fix: >
        Make `SuperBlock` retain the full `RawSuperBlock` information and copy
        those fields back explicitly instead of using `..Default::default()`.
      expectation: >
        A reviewer should flag that converting through `SuperBlock` must be a
        lossless read-modify-write path for all on-disk superblock fields,
        including currently unused and reserved ext2/ext3 metadata.

    - target:
        kind: file
        path: kernel/src/fs/ext2/super_block.rs
        lines: "378-386"
      persona: development
      grounding: "model ext2 fs state as bit flags"
      severity: major
      desc: >
        `FsState` is declared as a `TryFromInt` enum with mutually exclusive
        values, so a valid ext2 state containing both clean and error bits
        (`0x0003`) is rejected as invalid. The special `Corrupted = 117` enum
        value also treats the field as a single status code rather than the
        bitmask used by the on-disk format.
      fix: >
