- problem_id: 0414-vmar-heap-mapping-issues
  commit: 6d2ff13a639b9fff72842869cfd78f78ff21bbf2
  remote: https://github.com/asterinas/asterinas
  source: >
    PR-derived from https://github.com/asterinas/asterinas/pull/2942. The PR
    body identifies three fixes in the base commit: heap lock ordering issues
    around `/proc/[pid]/maps` and `fork_from`, removing duplicated inode state
    from `VmMapping`, and making `populate_device` infallible. Files mode uses
    the PR base commit `6d2ff13a639b9fff72842869cfd78f78ff21bbf2`, before the
    PR's fixing commits `e29b5547c34ddbdfdccd1c1d6fce831926e61412`,
    `ae7ed6f2169ba8064ffb63e32a2c252b241514df`, and
    `da93d7791c24e0b7014059beae40e27244f42447`, so the targets are leak-free.
  review_mode:
    files:
      - kernel/src/fs/procfs/pid/task/maps.rs
      - kernel/src/vm/vmar/vm_mapping.rs
  defects:
    - target:
        kind: file
        path: kernel/src/fs/procfs/pid/task/maps.rs
        lines: "34-45"
      persona: development
      grounding: consistent heap locking for maps and fork
      severity: major
      desc: >
        The heap lock and the VMAR lock are acquired in opposite orders. The
        `brk()` path takes the heap lock before modifying the VMAR, whereas
        `/proc/[pid]/maps` holds the VMAR lock and acquires the heap lock while
        classifying mappings as `[heap]`. Concurrent `brk()` and maps generation
        can therefore deadlock. In addition, `Vmar::fork_from()` does not keep
        the heap locked while it clones the VMAR mappings, so a concurrent
        `brk()` can leave the child with heap metadata that does not match its
        copied mappings.
      fix: >
        Introduce a locked heap guard, take the heap lock before walking VMAR
        state, and pass that guarded heap state through the fork and maps paths
        so the lock order stays consistent.
      expectation: >
        A reviewer should flag the inconsistent heap/VMAR lock ordering and the
        missing stable heap guard, it may produce deadlock and races.
    - target:
        kind: file
        path: kernel/src/vm/vmar/vm_mapping.rs
        lines: "70-77"
      persona: development
      grounding: remove duplicate inode state from VmMapping
      severity: major
      desc: >
        `VmMapping` stores inode identity separately from the `Path` that
        already owns it, and the mapping construction/cloning code propagates
        both copies. That duplicates source-of-truth data across map/fork/clone
        paths and makes the metadata easy to drift out of sync.
      fix: >
        Remove the standalone `inode` field from `VmMapping`, derive inode
        information from `Path`, and update the mapping construction helpers to
        carry only the path/VMO state.
      expectation: >
        A reviewer should flag that the inode is duplicated alongside the
        path-backed mapping metadata and should be stored in only one place.

- problem_id: 0415-credentials-cap-and-id-syscalls
  commit: 5d0779bd832cc6ac029e6d4131586635c4cd4779
  remote: https://github.com/asterinas/asterinas
  source: >
    PR-derived from https://github.com/asterinas/asterinas/pull/2952. The PR
    body explicitly identifies four Credentials bugs in the base commit: root
    checks should use `CAP_SETUID`/`CAP_SETGID`, UID 0 is a valid UID, `setfsuid()`
    and `setfsgid()` must always return the old filesystem IDs instead of
    failing, and `setuid()`/`setgid()` may fail. Files mode uses the PR base
    commit `5d0779bd832cc6ac029e6d4131586635c4cd4779`, before the later fixing
    commits, so the targets are leak-free.
  review_mode:
    files:
      - kernel/src/process/credentials/credentials_.rs
      - kernel/src/syscall/setresuid.rs
      - kernel/src/syscall/setfsuid.rs
      - kernel/src/syscall/setuid.rs
      - kernel/src/syscall/setgid.rs
  defects:
    - target:
        kind: file
        path: kernel/src/process/credentials/credentials_.rs
        lines: "79-81,191-199,422-430"
      persona: development
      grounding: check CAP_SETUID and CAP_SETGID instead of root
      severity: major
      desc: >
        The base `Credentials_` implementation still treats "effective user is
        root" as the privilege test. That makes UID/GID changes depend on
        `euid.is_root()` instead of the relevant capability bits, so the
        privilege model is wrong for callers that have `CAP_SETUID` or
        `CAP_SETGID` without being root.
      fix: >
        Replace the root-based privilege checks with capability checks for
        `CAP_SETUID` and `CAP_SETGID` in the UID/GID mutation helpers and
        permission checks.
      expectation: >
        A reviewer should flag that the code still keys privilege off root and
        should instead consult the matching capability bits.
    - target:
        kind: file
        path: kernel/src/syscall/setresuid.rs
        lines: "9-26"
      persona: development
      grounding: zero UID is valid
      severity: major
      desc: >
        The syscall still treats `0` as "not provided" by mapping only strictly
        positive inputs to `Some(Uid)`. That makes UID 0 impossible to pass
        through `setresuid()`, even though zero is a valid UID and denotes the
        root user.
      fix: >
        Accept non-negative values (`>= 0`) when converting syscall arguments
        to `Uid`, so UID 0 is preserved.
      expectation: >
        A reviewer should flag that zero is a valid UID and should not be dropped
        by the syscall argument conversion.
    - target:
        kind: file
        path: kernel/src/syscall/setfsuid.rs
        lines: "15-18"
      persona: development
      grounding: setfsuid and setfsgid never fail
      severity: major
      desc: >
        `setfsuid()` and `setfsgid()` are wired as fallible syscalls, but the
        intended ABI is to always return the previous filesystem ID. Invalid
        input should not turn these syscalls into errors; they should simply
        report the old ID back to the caller.
      fix: >
        Make the syscall wrappers ignore the internal failure case and always
        return the old filesystem ID from `setfsuid()`/`setfsgid()`.
      expectation: >
        A reviewer should flag that the filesystem-ID syscalls are expected to
        be infallible and should return the old ID instead of propagating an
        error.
    - target:
        kind: file
        path: kernel/src/syscall/setuid.rs
        lines: "15-18"
      persona: development
      grounding: setuid and setgid may fail
      severity: major
      desc: >
        `setuid()` and `setgid()` are still modeled as unconditional success in
        the syscall layer. Once the credential checks are capability-based,
        these calls can legitimately fail and their errors must be surfaced to
        userspace.
      fix: >
        Propagate the result of the credential update from the `setuid()` and
        `setgid()` syscall wrappers instead of always returning success.
      expectation: >
        A reviewer should flag that `setuid()`/`setgid()` should be able to fail
        and that the syscall wrappers need to return those failures.

- problem_id: 0416-fair-weight-update-race
  commit: f76b4508d4da5b6d0075fc1d89dc2a5e6a87294b
  remote: https://github.com/asterinas/asterinas
  source: >
    PR-derived from https://github.com/asterinas/asterinas/pull/3190. The PR
    reports a race in the lock-free FairAttr weight-update protocol: a second
    update can be lost after fetch_weight reads the first pending weight but
    before it clears HAS_PENDING. The reviewed snapshot is the PR base
    f76b4508d4da5b6d0075fc1d89dc2a5e6a87294b, before the fixing commit
    9c10f6d690fc6f8a237babc04a9c2c85cdd20812, so the target is leak-free.
  review_mode:
    files:
      - kernel/src/sched/sched_class/fair.rs
  defects:
    - target:
        kind: file
        path: kernel/src/sched/sched_class/fair.rs
        lines: "144-185"
      persona: development
      grounding: careful-atomics
      severity: major
      desc: >
        FairAttr::update publishes the new pending_weight and HAS_PENDING
        through two independent atomic operations, while fetch_weight reads
        pending_weight and later clears HAS_PENDING with compare_exchange.
        If fetch_weight reads the first pending weight, a second update can
        store a newer weight before the compare_exchange succeeds. The CAS can
        still replace HAS_PENDING with the stale first weight, clearing the
        marker and losing the second update. The scheduler may therefore use
        an outdated weight and fail to re-evaluate the run-queue accounting.
      fix: >
        Serialize pending_weight updates and consumption with a SpinLock, and
        update the packed weight marker while holding that lock. Keep the
        lock-free fast path for fetch_weight when HAS_PENDING is clear.
      expectation: >
        A reviewer should identify that the two-atomic lock-free protocol is
        not linearizable across repeated updates, and require a lock or another
        single-state atomic protocol that preserves the latest weight.

- problem_id: 0417-sendfile-compatibility-defects
  commit: 43265692827968251230b20b8118c8a52cf49fdb
  remote: https://github.com/asterinas/asterinas
  source: >
    PR-derived from https://github.com/asterinas/asterinas/pull/3226. The base
    implementation has six independent sendfile defects: a short write can
    leave the input file position too far advanced, offset + count overflow is
    not rejected, read/write access is not checked up front, directory inputs
    are not rejected, O_APPEND outputs are not rejected, and a FIXME
    incorrectly stated that in_file could never be a socket. Files mode uses
    the PR base commit 43265692827968251230b20b8118c8a52cf49fdb, before the
    fixing commit 089bec814012449435ec192e6aa70ee8e82702c0, so the targets are
    leak-free.
  review_mode:
    files:
      - kernel/src/syscall/sendfile.rs
  defects:
    - target:
        kind: file
        path: kernel/src/syscall/sendfile.rs
        lines: "63-86,94-175"
      persona: development
      grounding: roll back the input position after a short write
      severity: major
      desc: >
        When offset_ptr is null, sendfile reads from and advances in_file's
        current position before writing the buffered data to out_file. If the
        output performs a short write, the input position must correspond to
        the bytes actually written, not all bytes read into the buffer. The
        base implementation cannot restore the position when seeking the input
        file fails and merely logs that it may be incorrect, so a retry can
        silently skip bytes that were never sent.
      fix: >
        Handle short writes with the appropriate sendfile/splice semantics and
        ensure that the input position reflects the number of bytes actually
        written. Rejecting non-seekable inputs is not a required fix: that is
        only a temporary workaround for the missing splice implementation, not
        a Linux sendfile requirement.
      expectation: >
        A reviewer should flag the silent-data-loss bug in the partial-write
        path: sendfile may advance the input position by bytes read rather than
        bytes written. Identifying this rollback defect is sufficient; the
        reviewer should not require an unconditional non-seekable-input check.

    - target:
        kind: file
        path: kernel/src/syscall/sendfile.rs
        lines: "26-45,91-134"
      persona: development
      grounding: reject offset and count arithmetic overflow
      severity: major
      desc: >
        When offset_ptr is non-null, `sendfile` validates only that offset and
        count are non-negative, then advances the explicit offset with
        unchecked arithmetic. It therefore accepts a transfer range for which
        offset + count overflows, allowing the offset to wrap or panic instead
        of rejecting the request with EINVAL.
      fix: >
        Validate the requested range before the transfer begins, using checked
        arithmetic for offset + count and returning EINVAL on overflow. Keep
        the existing negative-value checks and perform validation before any
        unsigned conversion or offset update.
      expectation: >
        A reviewer should identify offset + count overflow as an independent
        boundary-validation defect and require checked arithmetic with an EINVAL
        result. The other sendfile checks should not be required for this target.

    - target:
        kind: file
        path: kernel/src/syscall/sendfile.rs
        lines: "47-55,88-127"
      persona: development
      grounding: validate sendfile read and write access modes
      severity: major
      desc: >
        `sendfile` does not check that in_file is readable and out_file is
        writable before entering the transfer. It relies on read_bytes and
        write_bytes to report access errors, so a zero-count request can bypass
        both operations and incorrectly succeed for descriptors opened with
        the wrong access mode.
      fix: >
        Check that in_file is readable and out_file is writable before the data
        transfer, including when count is zero, and return EBADF for either
        invalid access mode.
      expectation: >
        A reviewer should identify the missing readable-input and writable-output
        checks as an independent defect and require EBADF for invalid descriptor
        modes. 

    - target:
        kind: file
        path: kernel/src/syscall/sendfile.rs
        lines: "47-55,94-127"
      persona: development
      grounding: reject directory inputs
      severity: major
      desc: >
        The implementation does not reject a directory used as in_file before
        the transfer. It sends the directory through the generic read path,
        which can return the wrong result or error, including on edge cases
        where the read loop is not entered. 
      fix: >
        Detect an in_file whose inode type is Dir before the transfer and return
        EINVAL, independently of whether the requested count causes a read.
      expectation: >
        A reviewer should flag directory input handling as an independent
        compatibility defect and require an explicit EINVAL check before the
        generic read path. 

    - target:
        kind: file
        path: kernel/src/syscall/sendfile.rs
        lines: "47-68,127-137"
      persona: development
      grounding: reject O_APPEND output files
      severity: major
      desc: >
        No validation rejects an output opened with O_APPEND. The code proceeds
        to write through out_file.write_bytes, so a non-pipe append-mode output
        can be accepted even though Linux sendfile rejects that combination
        with EINVAL.
      fix: >
        Inspect the output status flags before the transfer and return EINVAL
        for O_APPEND unless the output is a pipe handled by splice semantics.
      expectation: >
        A reviewer should flag missing O_APPEND validation as an independent
        defect and require EINVAL for non-pipe O_APPEND output.

    - target:
        kind: file
        path: kernel/src/syscall/sendfile.rs
        lines: "50-53"
      persona: maintainability
      grounding: do not preserve misleading Linux ABI comments
      severity: minor
      desc: >
        The FIXME says in_file must support mmap-like operations and therefore
        cannot be a socket. That is an incomplete reading of the Linux manual:
        since Linux 5.12, when out_fd is a pipe, sendfile is treated like splice
        and in_fd may be a socket. Keeping this FIXME makes the intended ABI and
        future implementation direction misleading.
      fix: >
        Remove the incorrect FIXME. If the limitation is documented, state the
        pipe/splice exception explicitly and use a TODO for the currently
        unsupported non-seekable-in_file-to-pipe case.
      expectation: >
        A reviewer should flag that the comment encodes a false sendfile
        restriction and should ask for it to be removed or rewritten to match
        the Linux manual.

- problem_id: 0419-osdk-hard-link-self-copy-truncation
  commit: 7f3a096428b9607793c312e065c8c778b73c9748
  remote: https://github.com/asterinas/asterinas
  source: >
    PR-derived from https://github.com/asterinas/asterinas/pull/3304. The PR
    fixes an OSDK artifact corruption case in the base implementation:
    `hard_link_or_copy` falls back to `fs::copy` whenever `fs::hard_link`
    fails, even when `from` and `to` already refer to the same inode through
    different hard-link paths. `fs::copy` truncates the destination in that
    case, corrupting the artifact. The reviewed snapshot is the PR base
    `7f3a096428b9607793c312e065c8c778b73c9748`, before the fixing commit
    `5e824c142a4ab0547e937febf33df7c19981494c`, so the target is leak-free.
  review_mode:
    files:
      - osdk/src/util.rs
  defects:
    - target:
        kind: file
        path: osdk/src/util.rs
        lines: "397-403"
      persona: development
      grounding: prevent self-copy truncation after hard-link failure
      severity: critical
      desc: >
        `hard_link_or_copy` treats every hard-link failure as evidence that a
        regular copy is required. If `to` already exists as a hard link to
        `from`, `fs::hard_link(&from, &to)` fails because the destination path
        exists, but `fs::copy(from, to)` then copies a file onto itself and
        truncates the shared inode. A repeated OSDK build can therefore destroy
        an otherwise valid kernel artifact and produce an empty or corrupted
        payload.
      fix: >
        Obtain metadata for the source and, when the destination exists,
        compare device and inode identifiers before attempting the fallback.
        Return `Ok(0)` immediately when both paths refer to the same file; only
        use `fs::copy` for a distinct destination after the hard-link attempt
        fails.
      expectation: >
        A reviewer should identify the same-inode self-copy path, and require
        an identity check that skips both linking and copying for an existing
        hard link to the source.

- problem_id: 0420-create-duplicate-check-and-ext2-slot-lookup
  commit: 7f3a096428b9607793c312e065c8c778b73c9748
  remote: https://github.com/asterinas/asterinas
  source: >
    PR-derived from https://github.com/asterinas/asterinas/pull/3311. The PR
    addresses two issues in the base implementation: create-related VFS
    operations rely on the dentry cache for duplicate-name detection even
    though the entry may be absent or stale after a race or eviction, and Ext2
    scans every directory entry with the name-reading iterator even though slot
    selection only needs entry headers. The reviewed snapshot is the PR base
    `7f3a096428b9607793c312e065c8c778b73c9748`, before fixing commits
    `aac90b22fe30a1f2d6b225d9071028b94619e85e` and
    `c0703ebe1bd9856ce38e42c7b83c063c8ba75261`, so both targets are
    leak-free.
  review_mode:
    files:
      - kernel/src/fs/vfs/path/dentry.rs
      - kernel/src/fs/fs_impls/ext2/inode/dir/mod.rs
  defects:
    - target:
        kind: file
        path: kernel/src/fs/vfs/path/dentry.rs
        lines: "393-425,523-562"
      persona: development
      grounding: validate duplicate names against the filesystem layer
      severity: major
      desc: >
        The `create`, `mknod`, and `link` paths only reject a duplicate when a
        positive dentry is present in the cache and revalidation confirms it.
        A cache miss, stale-entry eviction, or race can leave an existing
        filesystem entry absent from the dentry cache, after which the VFS
        directly invokes the filesystem operation. If the filesystem layer
        does not independently perform a reliable duplicate check, the
        operation can create a second on-disk directory entry with the same
        name, instead of returning `EEXIST`.
      fix: >
        Centralize the check in a VFS helper used by all create-related
        operations. After handling the cached entry, call the parent inode's
        lookup for the name, populate the cache when an existing inode is
        found, return `EEXIST`, and preserve the checked state while creating
        or linking the new entry. Propagate errors other than `ENOENT`.
      expectation: >
        A reviewer should identify that dentry-cache state is not the complete
        source of truth for name existence and require a filesystem lookup in
        the VFS path before `create`, `mknod`, or `link` proceeds.
    - target:
        kind: file
        path: kernel/src/fs/fs_impls/ext2/inode/dir/mod.rs
        lines: "582-625"
      persona: development
      grounding: avoid unnecessary page cache read operations
      severity: minor
      desc: >
        `scan_dir_for_slot` calls `next_entry()` for every directory entry.
        That iterator reads each live entry's name from the page cache, but
        slot selection only uses `ino`, `rec_len`, and `name_len`; it never
        needs the name bytes. Large Ext2 directories therefore perform many
        unnecessary page-cache reads on every file creation or link operation.
      fix: >
        Add or use an iterator operation that reads and advances by directory
        entry headers only, and use it in slot lookup. Keep the full
        name-reading iterator for operations such as duplicate checks and
        readdir that actually need entry names.
      expectation: >
        A reviewer should notice that slot allocation needs only metadata from
        each directory entry and should require a header-only scan so unrelated
        name data is not loaded from the page cache.

- problem_id: 0421-vsock-recv-partial-first-packet
  commit: b27cca2263b5512a83be3d7781da369ee19b53fe
  remote: https://github.com/asterinas/asterinas
  source: >
    PR-derived from https://github.com/asterinas/asterinas/pull/3332. The
    receive path removes the first queued packet and resets
    `rx_queue.read_offset`, but its packet-selection budget still counts the
    first packet's entire payload. When the first packet was partially
    consumed by an earlier `recv`, this overestimates the bytes available from
    that packet and can stop collection too early, producing an unexpected
    short read. The reviewed snapshot is the fixing commit's parent
    `b27cca2263b5512a83be3d7781da369ee19b53fe`, before
    `67d0348199f3a71f46060c20f9f44924cdc0e334`; it is also the merge base with
    the PR base branch, so the target is leak-free.
  review_mode:
    files:
      - kernel/src/net/socket/vsock/transport/connection/recv.rs
  defects:
    - target:
        kind: file
        path: kernel/src/net/socket/vsock/transport/connection/recv.rs
        lines: "140-159"
      persona: development
      grounding: account for the unread portion of the first packet
      severity: major
      desc: >
        `pop_rx_packets` uses the full `packet_ref.payload_len()` when
        decrementing `max_bytes`, even if `rx_queue.read_offset` says that the
        first packet has already been partially received. For example, after
        one byte of a two-byte packet has been consumed, a receive request for
        two bytes sees the full length of two and stops instead of collecting
        the next packet. The subsequent copy therefore returns only the one
        unread byte and violates the expected recv length.
      fix: >
        Compute the first packet's available length as its payload length minus
        the saved `rx_queue.read_offset` before comparing it with or subtracting
        it from `max_bytes`. Preserve the offset for the later userspace copy,
        then use full payload lengths for subsequent packets.
      expectation: >
        A reviewer should identify that packet selection should count only
        unread bytes from the first packet, and require subtracting the existing
        read offset from the first packet's contribution to the receive budget.

- problem_id: 0500-subreaper-reparenting-and-state
  commit: d5569147cb121ba367c104bc6b7a5fbf291efc06
  source: >
    PR-review-derived from PR #1861
    `https://github.com/asterinas/asterinas/pull/1861`. Comments
    `https://github.com/asterinas/asterinas/pull/1861#discussion_r1971071488`
    and `https://github.com/asterinas/asterinas/pull/1861#discussion_r1971121979`
    identified the zombie-reaper loop and incorrect descendant traversal,
    fixed by replacement head
    `ab3459c712eb692c05ead76dc4e4bbb3bc2f088f`. Comment
    `https://github.com/asterinas/asterinas/pull/1861#discussion_r1976953831`
    identified the exposed subreaper atomics and misplaced state-transition
    logic, fixed by final head
    `8e768e652440e8113b33d1ac4698db63e89af550`. The reviewed range predates all
    three remedies and contains no later comment or test that names them.
  review_mode:
    diff:
      base: 56b85cb132e54cc51522e6444bc17f9e00eb2ee3
  defects:
    - target: { kind: file, path: kernel/src/process/exit.rs }
      persona: development
      grounding: "Infinite exit loop"
      severity: major
      desc: >
        `find_reaper_process` returns the first ancestor marked as a child
        subreaper without checking whether that process is already a zombie.
        `move_children_to_reaper_process` then asks `copy_process_children` to
        use that zombie; the helper rejects it with `Err(())`, but the outer
        loop immediately repeats the same search with unchanged parent links
        and selects the same zombie again. An exiting process can therefore
        spin forever instead of continuing upward to a living subreaper or the
        init process and completing reparenting.
      fix: >
        While walking ancestors, return a subreaper only when it is not a
        zombie; otherwise continue toward its parent. Keep the guarded status
        check in the move helper to handle a reaper that becomes a zombie
        concurrently.
      expectation: >
        A reviewer should flag that selecting a zombie subreaper makes the
        retry loop choose the same rejected process forever and require the
        search to continue upward until it finds a living reaper.
    - target: { kind: file, path: kernel/src/syscall/prctl.rs }
      persona: development
      grounding: "Wrong traversal root"
      severity: major
      desc: >
        `propagate_has_child_subreaper` seeds a queue with the current
        process's direct children, but after popping a descendant it again
        iterates `current_process.children()` instead of `process.children()`.
        The traversal repeatedly considers the root's direct children and
        never discovers grandchildren or deeper descendants. Processes that
        already existed below the first level when an ancestor enables
        `PR_SET_CHILD_SUBREAPER` therefore retain a false
        `has_child_subreaper` flag and may reparent orphans to init instead of
        the applicable subreaper.
      fix: >
        In each breadth-first-search iteration, inspect the popped process's
        children and enqueue its unmarked descendants. This visits the complete
        existing subtree and propagates the flag to every level.
      expectation: >
        A reviewer should flag that the propagation loop always traverses
        `current_process.children()` and require it to traverse each dequeued
        `process` so grandchildren and deeper descendants are updated.
    - target: { kind: file, path: kernel/src/process/process/mod.rs }
      persona: security
      grounding: "Process-state encapsulation"
      severity: minor
      desc: >
        `Process::is_child_subreaper` and `has_child_subreaper` return shared
        references to their internal `AtomicBool` fields, while
        `propagate_has_child_subreaper` lives in the `prctl` syscall module.
        Any caller can directly store either flag without performing the
        companion transition or descendant propagation, so the process
        supervision state can violate the invariant that every descendant of a
        subreaper is marked as having one. Reparenting code then makes process
        lifecycle decisions from state that callers were able to corrupt
        outside the owning abstraction, weakening the integrity boundary around
        orphan supervision even though no external writer needs this access.
      fix: >
        Keep the atomics and propagation helper inside `Process`. Expose
        semantic `set_child_subreaper`, `unset_child_subreaper`, and boolean
        query methods that perform all required state transitions without
        returning mutable atomic storage to callers.
      expectation: >
        A reviewer should flag that the `&AtomicBool` getters let callers bypass
        the security-sensitive subreaper state transition and its descendant
        propagation, and require `Process` to expose only invariant-preserving
        semantic operations.

- problem_id: 0501-init-stream-state-naming-and-api
  commit: fd51b078a28e8c2a2db8fe4c882ef012793c9c5a
  source: >
    PR-review-derived from PR #1854
    `https://github.com/asterinas/asterinas/pull/1854`. Comments
    `https://github.com/asterinas/asterinas/pull/1854#discussion_r1969297064`
    and `https://github.com/asterinas/asterinas/pull/1854#discussion_r1969360360`
    identified the misleading connection-state names and documentation, while
    comment
    `https://github.com/asterinas/asterinas/pull/1854#discussion_r1969353273`
    identified the unused send/receive parameters. Final head
    `794327616ca24483c8cd4d2f38b69ca963da0094` applies both remedies. The
    reviewed range predates the renames, revised documentation, and simplified
    signatures, so none of those changes reveal the expected findings.
  review_mode:
    diff:
      base: 18e0eae33104fbeecf8ebde63abbdcb7cdf7cfef
  defects:
    - target: { kind: file, path: kernel/src/net/socket/ip/stream/init.rs }
      persona: maintainability
      grounding: least-surprise
      severity: minor
      desc: >
        `InitStream::try_recv` accepts a writer and receive flags, and
        `InitStream::try_send` accepts a reader and send flags, but all four
        parameters are underscore-prefixed and ignored. An initial stream
        cannot transfer payload data; these helpers only report connection
        errors or fixed empty results. Their signatures nevertheless imply
        that the supplied buffers and flags can affect the operation and force
        callers and the module to carry dependencies that have no effect.
      fix: >
        Remove the reader/writer and flags parameters from the `InitStream`
        helpers and call them without arguments. Keep those parameters only on
        the outer socket operations that actually dispatch to connected
        streams capable of consuming them.
      expectation: >
        A reviewer should flag the unused buffer and flags parameters on
        `InitStream::try_send` and `try_recv` and require signatures containing
        only inputs that can affect these initial-state operations.

- problem_id: 0502-file-common-state-invariants
  commit: f1102f40d2c5a5c59b11c818c4405984ffc0028f
  source: >
    PR-review-derived from PR #3577
    `https://github.com/asterinas/asterinas/pull/3577`. Comments
    `https://github.com/asterinas/asterinas/pull/3577#discussion_r3570041825`
    and `https://github.com/asterinas/asterinas/pull/3577#discussion_r3570054478`
    identified the unrestricted common-state mutation API and the mixed,
    duplicated eventfd flag state, fixed by replacement head
    `c65d269b41879212960e9af62087d49d9b51dbdf`. Comment
    `https://github.com/asterinas/asterinas/pull/3577#discussion_r3576550464`
    identified the file-reference drop in an IRQ-disabled observer callback,
    fixed by later head `bbe618f651a6a76b82f105fa06497412a65ed78c`.
    All three defects are already present in the reviewed range, which predates
    the typed update API, eventfd state cleanup, and observer-lifetime remedy.
  review_mode:
    diff:
      base: 51684041309e31c8c75d5085773cc45585fc82e2
  defects:
    - target: { kind: file, path: kernel/src/fs/file/file_common.rs }
      persona: maintainability
      grounding: information-hiding
      severity: minor
      desc: >
        `FileCommon::set_status_flags` and `FileCommon::update_status_flags` are
        public raw mutation APIs, and every `FileLike` exposes its
        `FileCommon` through `common()`. Any kernel caller can therefore bypass
        `FileLike::check_status_flags` and directly store or compute arbitrary
        flag combinations, including `O_DIRECT` on a file type that rejects it
        through the intended trait API. The common-state abstraction cannot
        enforce each file type's status-flag policy while these unchecked
        implementation details remain part of its public surface.
      fix: >
        Remove the unrestricted setter, restrict the low-level atomic update to
        the file module, and expose a validated operation on `dyn FileLike`. Use
        a typed `StatusFlagsUpdate` so callers describe only supported set,
        unset, or replacement operations before the common state is changed.
      expectation: >
        A reviewer should flag that callers can mutate `FileCommon` status flags
        directly and bypass `FileLike` validation, and require unchecked storage
        updates to remain private behind a policy-enforcing file API.
    - target: { kind: file, path: kernel/src/syscall/eventfd.rs }
      persona: maintainability
      grounding: rust-type-invariants
      severity: minor
      desc: >
        `EventFile` retains the complete creation-time `Flags` value in a
        mutable `Mutex` while also storing `O_NONBLOCK` in `FileCommon`. This
        gives one status flag two representations that diverge after `F_SETFL`,
        and it leaves descriptor-only `EFD_CLOEXEC` inside the shared file
        description even though close-on-exec belongs solely to the file-table
        entry. Only the immutable `EFD_SEMAPHORE` mode is actually needed after
        construction, so the mixed flag field admits stale and ownership-invalid
        state without providing useful mutability.
      fix: >
        Extract `EFD_SEMAPHORE` once during construction into an immutable
        `is_semaphore` boolean, keep `O_NONBLOCK` only in `FileCommon`, and keep
        `EFD_CLOEXEC` only in the descriptor's `FdFlags`. Remove the retained
        `Mutex<Flags>`.
      expectation: >
        A reviewer should flag that `EventFile` retains creation, descriptor,
        and status flags together while duplicating `O_NONBLOCK`, and require it
        to store only its immutable semaphore mode after construction.
    - target: { kind: file, path: kernel/src/fs/file/file_common.rs }
      persona: development
      grounding: "Drop in atomic context"
      severity: major
      desc: >
        `OwnerObserver::on_events` upgrades a `Weak<dyn FileLike>` to an `Arc`
        and lets that temporary strong reference fall out of scope in the
        callback. Observer notifications can run with local IRQs disabled. If a
        concurrent close drops the other last strong reference while the
        callback is executing, this temporary becomes the final reference and
        dropping it destroys the file in atomic context. A file destructor may
        release resources or otherwise perform work that is forbidden with IRQs
        disabled, violating the kernel's atomic-mode requirements.
      fix: >
        Do not upgrade or drop a file reference in the observer callback. Track
        `O_ASYNC` by registering or unregistering the observer when status flags
        change under the owner lock, and let `on_events` only enqueue `SIGIO`
        through the owner's weak process reference.
      expectation: >
        A reviewer should flag that `OwnerObserver::on_events` can drop the last
        `Arc<dyn FileLike>` while IRQs are disabled and require the callback to
        avoid acquiring any temporary file ownership.

- problem_id: 0503-ambient-exec-toctou-and-parser-visibility
  commit: 3bfd9534a848c4ae0c00758238764d03cd15ce51
  source: >
    PR-review-derived from PR #3510
    `https://github.com/asterinas/asterinas/pull/3510`. Comments
    `https://github.com/asterinas/asterinas/pull/3510#discussion_r3526309632`
    and
    `https://github.com/asterinas/asterinas/pull/3510#discussion_r3526309593`
    identified the privileged-exec metadata TOCTOU and unnecessarily public
    parser enums. Replacement head
    `5cd7a76397e0a919a6852de96b8bceb2cb611fda` derives the privilege decision
    and credential changes from one captured mode and makes the parser enums
    private. The reviewed range predates both remedies and contains no review
    or fix text that reveals them.
  review_mode:
    diff:
      base: 6eeea918b46452cda2dbe1cc9058654e383bf9b6
  defects:
    - target: { kind: file, path: kernel/src/process/execve.rs }
      persona: security
      grounding: "Privileged-exec TOCTOU"
      severity: major
      desc: >
        `apply_caps_from_exec` decides whether to clear the ambient capability
        set by reading `elf_inode.mode()`, then `set_uid_from_elf` and
        `set_gid_from_elf` read the inode mode again before applying setuid or
        setgid credentials. Another task can add a privilege bit between those
        reads: the first check then skips `clear_ambient_capset`, while a helper
        observes the new bit and changes the effective UID or GID. The process
        consequently preserves `CapAmb` across an execution that is treated as
        privileged, violating the capability boundary for privileged exec.
      fix: >
        Capture the inode privilege state once, together with the corresponding
        owner or group metadata, or protect the metadata with one lock. Use the
        same captured `has_set_uid` and `has_set_gid` values both to clear the
        ambient set and to apply the credential changes, so those decisions
        cannot diverge.
      expectation: >
        A reviewer should flag that repeated inode-mode reads split the ambient
        clearing decision from the later setuid/setgid action and require both
        to use one consistent metadata snapshot.
    - target: { kind: file, path: kernel/src/syscall/prctl.rs }
      persona: maintainability
      grounding: narrow-visibility
      severity: minor
      desc: >
        The newly added `CapAmbientCmd` is declared `pub` and is exposed through
        the public `PrctlCmd::PR_CAP_AMBIENT` variant, even though repository-wide
        usage at this snapshot is confined to `prctl.rs`. These enums represent
        file-local syscall parsing and dispatch state, so publishing them creates
        an unsupported API surface and allows unrelated modules to couple to
        parser internals without an actual consumer requiring that visibility.
      fix: >
        Keep `CapAmbientCmd` and the surrounding parser enums private to
        `prctl.rs`; widen an individual type only if a real external consumer is
        introduced later.
      expectation: >
        A reviewer should flag the public visibility of `CapAmbientCmd` and the
        file-local `prctl` parser types and require them to remain private in the
        absence of an external consumer.

- problem_id: 0504-wait-stop-process-semantics-and-state-cleanup
  commit: d34dd0bfba07bc9d9d940068f43deee5bdfb169d
  source: >
    PR-review-derived from PR #2166
    `https://github.com/asterinas/asterinas/pull/2166`. Comments
    `https://github.com/asterinas/asterinas/pull/2166#discussion_r2151247478`,
    `https://github.com/asterinas/asterinas/pull/2166#discussion_r2151229230`,
    and
    `https://github.com/asterinas/asterinas/pull/2166#discussion_r2151243240`
    identified the thread-scoped stop/continue model, the obsolete generic
    thread-status enum, and the redundant stop-wait control flow. Replacement
    head `7738b038783a6909d9d424a3541b2c313451be0e` contains the corresponding
    process-scoped status and cleanup; the reviewed snapshot predates those
    remedies.
  review_mode:
    diff:
      base: 5a514f6163ef368031b159cbdfbe4112619f1c2a
  defects:
    - target: { kind: file, path: kernel/src/process/wait.rs }
      persona: development
      grounding: "Wrong process-state ownership"
      severity: major
      desc: >
        Stop and continue state is stored on each `PosixThread`, and
        `wait_thread` scans every task of a child process and returns the TID of
        whichever thread reports a transition. Linux job-control stop and
        continue events are process-level: a process-directed `SIGSTOP` must
        stop the whole multithreaded process, `SIGCONT` must resume all of its
        threads, and the parent's wait call reports one state change for the
        child PID. In this implementation only the thread selected to handle
        the signal changes state, so sibling threads can keep executing and
        `wait4` can report a non-leader TID instead of the child PID.
      fix: >
        Store stop/continue state and its unconsumed wait event in
        `ProcessStatus`. Handle the default stop and continue actions through
        the process, wake every stopped thread when continuing, and have the
        parent inspect each child process once and return that process's PID.
      expectation: >
        A reviewer should flag that `wait_thread` and the per-`PosixThread`
        status model treat `SIGSTOP`, `SIGCONT`, `WSTOPPED`, and `WCONTINUED` as
        thread-level events, and require process-owned state that stops or
        resumes all threads and reports the child PID.
    - target: { kind: file, path: kernel/src/thread/status.rs }
      persona: maintainability
      grounding: rust-type-invariants
      severity: minor
      desc: >
        The change removes every operation and query that can put the generic
        `Thread` into `ThreadStatus::Stopped`, but leaves `Stopped` in the enum.
        The remaining abstraction also retains `Init` and `Running` even though
        consumers only ask whether a thread has exited. It therefore exposes
        lifecycle states that are no longer meaningful or observable and keeps
        a second thread-status concept beside the newly added POSIX stop-status
        type, making invalid and confusing states representable.
      fix: >
        Remove the obsolete `ThreadStatus` enum and its atomic wrapper. Replace
        the generic thread field with the only remaining state it needs, an
        `AtomicBool` that records whether the thread has exited, while keeping
        job-control state on the process.
      expectation: >
        A reviewer should flag that `ThreadStatus::Stopped` is left unreachable
        after its stop/resume users are removed and require the generic status
        abstraction to be reduced to the actual exited-state invariant.
    - target: { kind: file, path: kernel/src/thread/task.rs }
      persona: maintainability
      grounding: minimize-nesting
      severity: minor
      desc: >
        The stopped-thread path introduces a private `WaitQueue`, a local
        three-variant `Status` enum, nested loops, and checks for the running,
        exited, and pending-signal states both before and inside
        `pause_until`. The wait primitive already performs its own fast-path
        condition check and returns on pending signals, and no producer uses
        this one-consumer queue to wake a group. The duplicated machinery makes
        the task-entry control flow harder to verify without adding a distinct
        state transition or wake-up mechanism.
      fix: >
        Use a single `Waiter` for the task and one compact retry loop: handle a
        pending signal, leave when the thread exits or the process is running,
        otherwise pause until the process stop state changes and retry after an
        interruption. Rely on the waiter for its existing fast-path and signal
        behavior.
      expectation: >
        A reviewer should flag the redundant fast path, pending-signal checks,
        local status enum, and nested `WaitQueue::pause_until` flow, and require
        the stopped-thread wait to be expressed as one simple waiter loop.

- problem_id: 0505-mremap-resize-transaction-and-boundaries
  commit: aafb2f576e2ce77ad45c5be50f2018a383cf6b20
  source: >
    PR-review-derived from PR #2162
    `https://github.com/asterinas/asterinas/pull/2162`. Comments
    `https://github.com/asterinas/asterinas/pull/2162#discussion_r2153532001`,
    `https://github.com/asterinas/asterinas/pull/2162#discussion_r2153947946`,
    and
    `https://github.com/asterinas/asterinas/pull/2162#discussion_r2153564195`
    identified the destructive failed resize, unchecked user-sized expansion,
    and split syscall/VMAR responsibilities. Replacement heads
    `3261da15b3e9c8435a123962baffcb4a0f9d716f` and
    `503e9bcd27624bf8f535669e982de743142ae7c2` add the rollback/preflight,
    checked range validation, and API refactoring; the reviewed snapshot
    predates those remedies.
  review_mode:
    diff:
      base: a2aedcfb3afa31d8cf27b9b458df7103e3c68bfe
  defects:
    - target: { kind: file, path: kernel/src/vm/vmar/mod.rs }
      persona: development
      grounding: "Rollback on failed resize"
      severity: major
      desc: >
        When an in-place `mremap` expansion is requested, `resize_mapping`
        removes the last `VmMapping` from `vm_mappings` and decrements
        `total_vm` before calling the fallible `alloc_free_region_exact` for
        the extension. If another mapping occupies that extension, the
        allocation returns an error, but the removed mapping is never inserted
        back and its page-table mapping is never unmapped. A failed syscall can
        therefore leave the address-space metadata missing a still-mapped
        region, allowing later mappings to overlap it and making accounting
        inconsistent.
      fix: >
        Validate or reserve the complete extension before removing the existing
        mapping, or restore the mapping and accounting on every allocation
        failure. The old mapping and page-table state must remain unchanged
        whenever `mremap` returns an error.
      expectation: >
        A reviewer should flag that `resize_mapping` mutates the mapping tree
        before a fallible extension allocation and require a preflight or
        rollback path that preserves the original mapping on failure.
    - target: { kind: file, path: kernel/src/vm/vmar/mod.rs }
      persona: development
      grounding: checked-arithmetic
      severity: major
      desc: >
        The no-`MREMAP_MAYMOVE` expansion path computes
        `new_map_end = map_addr + new_size` with unchecked arithmetic even
        though `new_size` comes from the user syscall. A sufficiently large
        size can wrap the end address, and the subsequent
        `new_map_end - extra_mapping_start` can underflow, producing an
        invalid range or an overflow panic instead of a syscall error. The
        path also accepts an end outside the user address space because it
        performs no boundary validation before changing the VMAR.
      fix: >
        Build the new end with `checked_add`, reject overflow with `EINVAL`,
        and verify that the resulting exclusive end is a legal user-space
        address before subtracting sizes or mutating the mapping tree.
      expectation: >
        A reviewer should flag the unchecked user-controlled `map_addr +
        new_size` calculation in `resize_mapping` and require checked range
        arithmetic plus user-address validation before expansion.
    - target: { kind: file, path: kernel/src/syscall/mremap.rs }
      persona: maintainability
      grounding: coupling-cohesion
      severity: minor
      desc: >
        `sys_mremap` validates some ABI rules and fixed-address details, then
        passes the public `MremapFlags` into `Vmar::remap`, where syscall flag
        policy is interpreted again to choose fixed, movable, shrinking, or
        in-place behavior. The VMAR layer therefore depends on a syscall
        parser type and owns part of the Linux dispatch contract, while the
        entry point is only a partial specification of the operation. Adding a
        flag or changing one validation rule requires tracing two layers and
        can leave their accepted cases inconsistent.
      fix: >
        Decode and validate `MremapFlags` at the syscall boundary and dispatch
        to VMAR methods whose parameters express only mapping operations, such
        as optional destination, old size, and new size. Keep the flag enum
        private to the syscall module so VMAR code does not own ABI policy.
      expectation: >
        A reviewer should flag that `MremapFlags` and mremap policy are split
        between `sys_mremap` and `Vmar::remap`, and require the syscall layer to
        own flag dispatch while VMAR exposes flag-independent mapping APIs.

- problem_id: 0506-pidfd-open-validation-and-file-semantics
  commit: b68533bac1032928e1f90b9145dbe8619a9b264d
  source: >
    PR-review-derived from PR #2151
    `https://github.com/asterinas/asterinas/pull/2151`. The review comment
    `https://github.com/asterinas/asterinas/pull/2151#discussion_r2151360609`
    identified the missing `EINVAL` validation for unknown flags and invalid
    PIDs; the contract is documented in
    `https://man7.org/linux/man-pages/man2/pidfd_open.2.html`, and the later
    head `b4dd67f90549653373a9033d49936bd128ee8753` uses exact flag parsing
    and rejects negative PIDs. The later review revision
    `088fbf2d2c95e209e118cd9859fd739f5f46ae82` removes the redundant `Pollee`
    clone and adds explicit PID-file `read`/`write` errors, matching comments
    `https://github.com/asterinas/asterinas/pull/2151#discussion_r2151386426`
    and
    `https://github.com/asterinas/asterinas/pull/2151#discussion_r2156211774`.
    The reviewed diff predates all of these fixes and contains no later guards,
    tests, or fix text that would reveal the expected findings.
  review_mode:
    diff:
      base: 796635486c75282a52275dd15f4e6d33b4a1b75b
  defects:
    - target: { kind: file, path: kernel/src/syscall/pidfd_open.rs }
      persona: security
      grounding: validate-at-boundaries
      severity: major
      desc: >
        `sys_pidfd_open` converts `flags` with
        `PidfdFlags::from_bits_truncate`, so unknown bits are silently dropped
        and the call can succeed as though the caller passed zero. It also uses
        the unsigned `Pid` directly for lookup, so a negative user PID such as
        `-1` is treated as a large unsigned value and falls through to
        `ESRCH`. Linux's `pidfd_open(2)` contract requires `EINVAL` for both an
        invalid flags value and an invalid PID, making the syscall boundary
        accept malformed user input and return incompatible errors.
      fix: >
        Parse flags with `PidfdFlags::from_bits` and reject `None` with
        `EINVAL`. Validate the signed PID representation before process-table
        lookup, returning `EINVAL` for negative PIDs while preserving `ESRCH`
        for a well-formed positive PID that does not exist.
      expectation: >
        A reviewer should flag that `sys_pidfd_open` silently truncates unknown
        flags and fails to reject negative PIDs with Linux-compatible `EINVAL`
        at the syscall boundary.
    - target: { kind: file, path: kernel/src/process/pid_file.rs }
      persona: development
      grounding: "Incorrect errno"
      severity: major
      desc: >
        `PidFile` implements `FileLike` without overriding `read` or `write`.
        The trait defaults therefore return `EBADF` for both operations, but a
        PID file descriptor is a valid descriptor whose contents are simply not
        readable or writable: Linux documents `read(2)` on a pidfd as failing
        with `EINVAL`, and the later regression test checks `EINVAL` for both
        directions (while positional operations remain `ESPIPE`). The new
        pidfd API consequently exposes the wrong observable errno for ordinary
        unsupported operations.
      fix: >
        Implement `FileLike::read` and `FileLike::write` on `PidFile` explicitly
        and return `EINVAL`; leave the inherited `read_at` and `write_at`
        `ESPIPE` behavior for the non-seekable descriptor.
      expectation: >
        A reviewer should flag that `PidFile` inherits `FileLike`'s `EBADF`
        defaults and require explicit `read`/`write` implementations returning
        the Linux-compatible `EINVAL`.
    - target: { kind: file, path: kernel/src/process/pid_file.rs }
      persona: development
      grounding: minimize-copies
      severity: minor
      desc: >
        `PidFile::new` clones `process.pidfile_pollee` into a second field even
        though the owning `Process` already stores the sole readiness object
        used by `exit_process` to notify PID-file pollers. The clone only
        increments the `Arc` and makes `PidFile` carry a duplicate handle to
        process-owned state, so the source of truth is less obvious and future
        changes can accidentally poll or notify different objects.
      fix: >
        Remove the `pollee` field and use `self.process.pidfile_pollee`
        directly in `Pollable::poll`, or expose a small process accessor if
        visibility requires it.
      expectation: >
        A reviewer should flag the needless `Pollee` clone in `PidFile` and
        require polling to use the `Process`-owned pollee directly.

- problem_id: 0507-memfd-boundary-and-detached-dentry-design
  commit: 26dff2ac4b9127bba89bbbc0346a93806c4767fd
  source: >
    PR-review-derived from PR #2149
    `https://github.com/asterinas/asterinas/pull/2149`. Comments
    `https://github.com/asterinas/asterinas/pull/2149#discussion_r2137384742`,
    `https://github.com/asterinas/asterinas/pull/2149#discussion_r2137441471`,
    and
    `https://github.com/asterinas/asterinas/pull/2149#discussion_r2137389873`
    identified the wrong error boundary for overlong names, the detached-state
    expansion of the core `Dentry` abstraction, and the unnecessarily public
    syscall flags type. The final head
    `8fee9cd16ab2cd61f3e626cb08118e1105d82c8f` replaces the detached `Dentry`
    design with a dedicated `MemfdFile` over a detached inode and narrows the
    flags type; it explicitly leaves the name-length errno mismatch as a
    FIXME. The reviewed diff predates those revisions and contains the three
    review targets in their original form.
  review_mode:
    diff:
      base: 0b471ef370d6333553b675fcf40ad5a8f4ba65fe
  defects:
    - target: { kind: file, path: kernel/src/syscall/memfd_create.rs }
      persona: development
      grounding: "Incorrect errno"
      severity: major
      desc: >
        `sys_memfd_create` reads the name with the generic
        `MAX_FILENAME_LEN` limit before `MemfdManager::create` applies the
        memfd-specific 249-byte limit. A valid user string whose terminating
        NUL lies beyond the generic read bound makes `read_cstring` return
        `EFAULT`, even though Linux requires `EINVAL` when the supplied memfd
        name is too long. The private `NAME_MAX` in the manager also prevents
        the syscall boundary from using the authoritative limit, so the two
        layers can disagree about which inputs are readable versus invalid.
      fix: >
        Define one shared memfd-name limit of 249 bytes and read enough user
        data at the syscall boundary to distinguish an inaccessible address
        from an accessible but overlong string. Preserve `EFAULT` for genuine
        user-memory faults, but return `EINVAL` whenever the readable name
        exceeds the memfd limit before creating the file.
      expectation: >
        A reviewer should flag that the generic bounded `read_cstring` can map
        an overlong memfd name to `EFAULT` and require one shared 249-byte
        limit with Linux-compatible `EINVAL` handling for readable long names.
    - target: { kind: file, path: kernel/src/fs/path/dentry.rs }
      persona: maintainability
      grounding: rust-type-invariants
      severity: major
      desc: >
        To represent an anonymous memfd, the patch changes every `Dentry` to
        hold an optional mount node and changes its name/parent state to allow
        a named entry without a parent. Most existing `Dentry` operations are
        only valid for mounted entries, so `mount_node()` and `DentryKey::new`
        recover the old invariant with `unwrap` or an explicit panic while
        many unrelated VFS methods must thread the new optional state. A
        memfd can therefore create a `Dentry` value that satisfies the type but
        is invalid for the public API's ordinary operations, spreading a
        special-case anonymous-file state through the core path abstraction.
      fix: >
        Preserve `Dentry` as an always-mounted path type with a nonoptional
        mount node and its existing parent invariants. Represent memfd with a
        dedicated `FileLike` implementation over a detached inode, or another
        narrow anonymous-inode abstraction, so operations that require a mount
        tree cannot be called on an anonymous file state.
      expectation: >
        A reviewer should flag that optional mount and parent state makes
        detached dentries legal at the type level while core `Dentry` methods
        panic on them, and require memfd anonymity to be represented outside
        the mounted `Dentry` abstraction.
    - target: { kind: file, path: kernel/src/syscall/memfd_create.rs }
      persona: maintainability
      grounding: narrow-visibility
      severity: minor
      desc: >
        `MemfdFlags` is declared `pub` even though it is only parsed and
        inspected inside `memfd_create.rs`. This exposes syscall-local
        dispatch state as a kernel-wide API without a consumer, allowing other
        modules to couple to an implementation detail and making future flag
        parsing changes unnecessarily cross-module.
      fix: >
        Keep `MemfdFlags` private to the syscall module and widen its
        visibility only if a concrete external consumer is introduced.
      expectation: >
        A reviewer should flag the public visibility of the syscall-local
        `MemfdFlags` type and require it to remain private.

- problem_id: 0508-netlink-uevent-deadlock-and-design
  commit: 92d613a2cd445ed387b990304dea5bf79a9e39b1
  source: >
    PR-review-derived from PR #2109
    `https://github.com/asterinas/asterinas/pull/2109`. Comments
    `https://github.com/asterinas/asterinas/pull/2109#discussion_r2122494424`,
    `https://github.com/asterinas/asterinas/pull/2109#discussion_r2122481943`,
    `https://github.com/asterinas/asterinas/pull/2109#discussion_r2122522482`,
    and
    `https://github.com/asterinas/asterinas/pull/2109#discussion_r2122522689`
    identified the socket-lifetime deadlock and eager parser allocations.
    Replacement head `5b3a13b71fd3eee04937a1c6421df5cd5e1ad45d` stores
    independently owned message receivers and parses synthetic uevents through
    iterators; final head `acfa9a9e5659d65d0e2b02217008dea28bbe5211` retains
    those remedies. The reviewed diff predates all review comments and fixes
    and contains no later explanation that reveals the expected findings.
  review_mode:
    diff:
      base: 4f74048aca6e939251d0fcf961292e87918f9acc
  defects:
    - target: { kind: file, path: kernel/src/net/socket/netlink/mod.rs }
      persona: development
      grounding: "Lock reentrancy deadlock"
      severity: major
      desc: >
        The netlink table holds a protocol `RwLock` read guard while dispatching
        a message through an `AnyNetlinkSocket` weak reference. If another
        thread concurrently closes the socket after `Weak::upgrade` succeeds,
        the temporary upgraded `Arc` can become the final strong reference.
        Dropping that `Arc` at the end of `enqueue_unicast_message` or
        `enqueue_mutlicast_message` drops its `BoundHandle`, whose `Drop`
        implementation tries to acquire the same protocol table's write lock.
        The outer read guard is still held, so the delivery path waits forever
        for a lock that it prevents from becoming available.
      fix: >
        Do not keep or upgrade the complete socket while holding the table
        lock. Store an independently owned message receiver containing the
        queue and `Pollee`, as in the accepted revision, so dispatch cannot
        destroy a `BoundHandle`; alternatively release the table guard before
        any operation that may drop the last socket reference.
      expectation: >
        A reviewer should flag that upgrading and then dropping a weak socket
        under the protocol table read lock can run `BoundHandle::drop` and
        recursively request the same table's write lock, causing a deadlock
        during concurrent socket close.
    - target: { kind: file, path: kernel/src/net/socket/netlink/kobject_uevent/message/syn_uevent.rs }
      persona: development
      grounding: minimize-copies
      severity: minor
      desc: >
        `SyntheticUevent::from_str` first collects every space-separated field
        into a `Vec<&str>` even though it only consumes the fields once, then
        allocates another `Vec<&str>` for every `KEY=VALUE` argument solely to
        inspect its two elements. The input and number of arguments are
        externally supplied, so parsing one uevent performs one unnecessary
        outer allocation plus an unnecessary allocation per environment entry
        in kernel context.
      fix: >
        Consume the whitespace split iterator directly with `next` for the
        action and UUID and iterate the remaining fields. Parse each environment
        field without collecting, using `split_once` or a bounded iterator
        check while preserving the required key/value validation.
      expectation: >
        A reviewer should flag both `collect::<Vec<_>>()` calls as unnecessary
        kernel heap allocations and require streaming iterator-based parsing.

- problem_id: 0509-process-refactor-rlimit-and-api-shape
  commit: d99287d4f26eb7a27f7e3b9cd269c49f37b350d7
  source: >
    PR-review-derived from PR #2062
    `https://github.com/asterinas/asterinas/pull/2062`. Comments
    `https://github.com/asterinas/asterinas/pull/2062#discussion_r2080751851`
    and
    `https://github.com/asterinas/asterinas/pull/2062#discussion_r2080753385`
    identified incorrect child resource limits and excessive `Process::run`
    visibility. In reply
    `https://github.com/asterinas/asterinas/pull/2062#discussion_r2080835344`,
    the author notes that the resource-limit behavior predated the PR; the
    reviewed refactor nevertheless materializes the faulty
    `ResourceLimits::default()` as a newly added line in its child-creation
    helper, so it remains visible in the requested diff review. Linux's
    inheritance contract is documented at
    `https://man7.org/linux/man-pages/man2/getrlimit.2.html`. Force-pushed final
    head `f40713d750e7a379cd86b11ae13001ad7993d761` clones the parent's limits
    and narrows `run`. The reviewed snapshot predates those comments and fixes
    and contains no later explanation that reveals the expected findings.
  review_mode:
    diff:
      base: 2961b89caa380f049766020b01e2c1af7930ec3d
  defects:
    - target: { kind: file, path: kernel/src/process/clone.rs }
      persona: development
      grounding: "Incorrect resource-limit inheritance"
      severity: major
      desc: >
        `create_child_process` constructs `ResourceLimits::default()` for every
        new child instead of carrying over the calling process's current soft
        and hard limits. After a parent lowers a limit such as `RLIMIT_NOFILE`,
        `fork` or `clone` therefore gives the child the boot defaults rather
        than the parent's values, allowing it to evade or unexpectedly tighten
        resource ceilings. Linux requires a child created by `fork` to inherit
        its parent's resource limits and preserves them across `execve`.
      fix: >
        Take a synchronized snapshot of every parent `RLimit64`, build an
        independent `ResourceLimits` value for the child, and pass it into
        `create_child_process`. The accepted revision implements `Clone` by
        reading each current/max pair under its lock before constructing the
        child's copy.
      expectation: >
        A reviewer should flag that resetting child resource limits to
        `ResourceLimits::default()` violates fork inheritance and require an
        independent copy of the parent's current limits.
    - target: { kind: file, path: kernel/src/process/process/mod.rs }
      persona: maintainability
      grounding: narrow-visibility
      severity: minor
      desc: >
        After init-process creation is moved into the child `init_proc` module,
        `Process::run` remains `pub`, exposing a process-construction lifecycle
        operation to the entire kernel crate. The method assumes that the
        process has exactly one task and is not a zombie, but enforces those
        preconditions only with debug assertions, so a wider API invites calls
        from modules that do not own or preserve the initialization protocol.
        The child module only requires parent-module visibility.
      fix: >
        Declare `Process::run` as `pub(super)` so it remains callable from
        `process::init_proc` without becoming a crate-wide process API.
      expectation: >
        A reviewer should flag `Process::run` as unnecessarily public after the
        module split and require `pub(super)` visibility.

- problem_id: 0510-i8042-protocol-correctness
  commit: 128ad4ac94999481deff960085b3ece872261cf9
  source: >
    PR-review-derived from PR #2054
    `https://github.com/asterinas/asterinas/pull/2054`. Comments
    `https://github.com/asterinas/asterinas/pull/2054#discussion_r2073849973`,
    `https://github.com/asterinas/asterinas/pull/2054#discussion_r2073908244`,
    and
    `https://github.com/asterinas/asterinas/pull/2054#discussion_r2073797889`
    identified omitted controller initialization, invalid output-buffer
    handling, and spurious NUL input. Force-pushed final head
    `d32591ee8e14c8f76c857ebefa69504843593f9e` implements status-aware
    controller/device initialization and separates ignored keys from NUL. The
    reviewed diff predates those revisions and contains no later comments or
    fixes that reveal the expected findings.
  review_mode:
    diff:
      base: c519db518f0e2dd21131b26f5cd26f954b01d54f
  defects:
    - target: { kind: file, path: kernel/comps/keyboard/src/i8042_keyboard.rs }
      persona: hardware
      grounding: "Missing controller initialization"
      severity: major
      desc: >
        `init` only acquires ports 0x60 and 0x64, installs an IRQ handler, and
        enables IRQ 1. It never disables the controller ports, flushes pending
        output, programs the configuration byte, runs controller and port
        tests, or resets and identifies the attached PS/2 device. The driver
        therefore assumes that firmware left a present i8042 controller and a
        compatible keyboard in exactly the required state. A disabled port,
        unexpected translation mode, failed controller, or non-keyboard device
        is silently accepted and then treated as a Scan Code Set 1 keyboard,
        yielding missing or incorrectly decoded input.
      fix: >
        Implement the i8042 initialization sequence before enabling keyboard
        interrupts: disable the ports, flush pending data, configure and test
        the controller and interfaces, reset and identify the keyboard, and
        leave unsupported or failed ports disabled. Publish the controller and
        handler state before writing the configuration that enables keyboard
        interrupts.
      expectation: >
        A reviewer should flag that the driver enables the i8042 keyboard IRQ
        without initializing or validating the controller and attached device,
        and require a protocol-compliant initialization sequence first.
    - target: { kind: file, path: kernel/comps/keyboard/src/i8042_keyboard.rs }
      persona: hardware
      grounding: "Invalid device-register read"
      severity: major
      desc: >
        `parse_inputkey` reads port 0x60 through `ScanCode::read` before reading
        the status register. Its `output_buffer_is_full` predicate is also
        inverted, returning true when status bit 0 is clear, and the subsequent
        branch merely logs instead of rejecting the read. The i8042 contract
        requires status bit 0 to be set before port 0x60 is read, so an IRQ or
        call with an empty output buffer can consume and report stale or
        undefined data as a key event.
      fix: >
        Read the status register first and access port 0x60 only when the output
        buffer full bit is set. Encapsulate this ordering in a `receive_data`
        operation that returns no value while the buffer is empty, and have the
        input path stop without parsing or reporting a key in that case.
      expectation: >
        A reviewer should flag that port 0x60 is read before the output-buffer
        status confirms data is available, with an inverted and non-gating
        readiness check, and require status-gated data reads.
    - target: { kind: file, path: kernel/comps/keyboard/src/i8042_keyboard.rs }
      persona: development
      grounding: "Spurious input event"
      severity: major
      desc: >
        `parse_inputkey` uses `InputKey::Nul` both for the real NUL control
        character and as a sentinel for modifier presses, key releases,
        extension prefixes, invalid bytes, and unknown scan codes. The IRQ
        handler forwards every returned value to all callbacks, while
        `InputKey::Nul` converts to the byte `0x00`. Pressing or releasing Shift,
        Ctrl, Caps Lock, or an unsupported key therefore injects a NUL byte into
        the terminal input stream even though no character was entered.
      fix: >
        Represent ignored scan codes separately from the real NUL character,
        for example with an `Ign` variant whose control sequence is empty or by
        returning `Option<InputKey>`, and do not emit input bytes for ignored
        events.
      expectation: >
        A reviewer should flag that ignored modifier, release, invalid, and
        unknown scan-code paths are forwarded as a real NUL byte and require a
        distinct no-input representation.

- problem_id: 0511-cgroup-pids-precharge-rollback-race
  commit: f404df954160a9dd8b180f8fe9e9630acd9445c6
  source: >
    PR-review-derived from PR #2987
    `https://github.com/asterinas/asterinas/pull/2987`. The reviewed series is
    the original implementation commit `fbf01a11f62c5b7f8e5a854a779c1d4943bf8426`
    followed by its test commit `f404df954160a9dd8b180f8fe9e9630acd9445c6`,
    with series base `417d58dbac51a71cbe02b5615a7198184371ebd6`. Comment
    `https://github.com/asterinas/asterinas/pull/2987#discussion_r2917670068`
    suggested an RAII token for the manual rollback, while
    `https://github.com/asterinas/asterinas/pull/2987#discussion_r2918205958`
    identified the underlying race: the token must not outlive the cgroup
    membership read guard. The force-pushed final head
    `d162569ac9e063af0ded2c511fedf38f4b1c3b15` adds that lifetime binding. The
    reviewed range predates both comments and the remedy, and its reverse
    patch log contains the faulty pre-charge and rollback code.
  review_mode:
    diff:
      base: 417d58dbac51a71cbe02b5615a7198184371ebd6
  defects:
    - target: { kind: file, path: kernel/src/fs/fs_impls/cgroupfs/controller/mod.rs }
      persona: development
      grounding: atomic-critical-sections
      severity: major
      desc: >
        `pre_charge_pids` selects and charges the hierarchy currently returned by
        `self.pids.read()`, but `PidsPreCharge` stores only `&Controller`. Its
        `Drop` later calls `uncharge_pids`, which reads `self.pids` again instead
        of retaining the sub-controller that was actually charged. In
        `clone_child`, correctness depends on the token being dropped or applied
        before the separately managed `cgroup_read_guard` is released. If that
        lock is released first, a concurrent cgroup migration or subtree-control
        update can replace `self.pids`; rollback then decrements the replacement
        hierarchy while leaking the original charge. The lock/token ordering is
        only a convention and is not enforced by the type system, so a new
        fallible path or caller can reintroduce this race.
      fix: >
        Bind `PidsPreCharge` to the `CgroupMembership` read guard with a shared
        lifetime (for example,
        `pre_charge_pids<'a>(&'a self, &'a CgroupMembership) -> Result<PidsPreCharge<'a>>`)
        so Rust requires the token to be applied or dropped before the guard is
        released. Alternatively, retain the exact charged sub-controller or
        hierarchy in the token and roll back that snapshot directly. Keep raw
        uncharge and the commit operation private to the controller
        implementation.
      expectation: >
        A reviewer should flag that `PidsPreCharge` is not lifetime-bound to the
        `CgroupMembership` guard and that its `Drop` re-reads the current pids
        controller, allowing a concurrent cgroup update to roll back the wrong
        hierarchy. Require a lifetime-bound RAII token or an equivalent snapshot
        of the hierarchy that was charged.

- problem_id: 0512-nsfs-cache-critical-section
  commit: c21c8428e444322db9c174cb04b178ab6806cf12
  source: >
    PR-review-derived from PR #2966
    `https://github.com/asterinas/asterinas/pull/2966`. The change contains the
    four original refactor, test, nsfs, and setns commits. Comment
    `https://github.com/asterinas/asterinas/pull/2966#discussion_r2802637943`
    identified the split cache critical section.
    Force-pushed final head
    `86308e83daabb135b41fbc3c3a611855612985ac` holds the cache lock while
    capturing namespace state and updating the cached inode. The reviewed range
    predates this comment and remedy and contains no explanatory test.
  review_mode:
    diff:
      base: 6882eb73f4d0d5a934c8c89cb7897dc8213e1e37
  defects:
    - target: { kind: file, path: kernel/src/fs/procfs/pid/task/ns.rs }
      persona: development
      grounding: atomic-critical-sections
      severity: major
      desc: >
        `lookup_child` reads the target thread's namespace state and constructs
        a new symlink inode before acquiring `cached_children`'s write lock.
        If one lookup captures namespace A, the target switches to namespace B,
        and another lookup installs B before the first lookup obtains the cache
        lock, the delayed lookup overwrites the cache with its stale A inode.
        The individually locked namespace and cache operations therefore do not
        form one atomic validate-and-publish operation, leaving
        `/proc/<pid>/ns/<type>` cached against an obsolete namespace.
      fix: >
        Acquire the child-cache write guard before capturing the current
        namespace path and keep it through validation and replacement. Reuse a
        cached inode when its stored path matches the current namespace, and
        replace it under the same guard only when the path has changed.
      expectation: >
        A reviewer should flag that `lookup_child` resolves the namespace before
        locking `cached_children`, allowing a delayed lookup to publish a stale
        namespace inode, and require state capture plus cache update to remain
        in one critical section.

- problem_id: 0513-fs-creation-context-api-shape
  commit: b4b0ec713133be00f139909688ced4bad0bacea8
  source: >
    PR-review-derived from PR #3168
    `https://github.com/asterinas/asterinas/pull/3168`. Comments
    `https://github.com/asterinas/asterinas/pull/3168#discussion_r3121357952`
    and
