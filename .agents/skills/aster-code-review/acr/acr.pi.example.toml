[benchmark]
remote = "https://github.com/asterinas/asterinas"

[agent]
backend = "pi-agent"
model = "PulseToken/gpt-5.5"
review_model = "PulseToken/gpt-5.5"
reasoning_effort = "medium"
postprocess_reasoning_effort = "medium"
per_persona_context = "auto"
max_concurrency = 5
timeout_seconds = 1200
retries = 1
tools_enabled = true

[pi]
node_command = "node"
agent_dir = "~/.pi/agent"
bridge_startup_timeout_seconds = 30
shutdown_grace_seconds = 5
keep_native_sessions = true
trusted_extensions = []

[tools]
maintainability = ["source.read", "source.search", "git.show", "git.log", "git.blame", "guideline.show"]
development = ["source.read", "source.search", "git.show", "git.log", "git.blame", "guideline.show"]
security = ["source.read", "source.search", "git.show", "git.log", "git.blame", "guideline.show"]
hardware = ["source.read", "source.search", "git.show", "git.log", "git.blame", "guideline.show"]
documentation = ["source.read", "source.search", "git.show", "git.log", "git.blame", "guideline.show"]
verification = ["source.read", "source.search", "source.list", "git.show", "git.log", "git.blame"]
consolidation = []
summary = []
grader = []

[tracing]
enabled = true
include_sensitive_data = true
max_content_bytes = 65536
