#
# Asterinas does not expose the cgroup memory/IO/CPU controllers that systemd
# tries to program by default. Disable the default accounting so unit startup
# does not fail on memory.max writes.
[Manager]
DefaultMemoryAccounting=no
DefaultTasksAccounting=no
DefaultIOAccounting=no
DefaultCPUAccounting=no
DefaultIPAccounting=no
DefaultLimitNOFILE=1048576:1048576
LogTarget=console
LogLevel=info
