name: 'Test'
description: 'Run tests for Asterinas'
branding:
  icon: 'check-circle'
  color: 'green'
inputs:
  # General Configurations
  auto_test:
    description: 'Test type (general, osdk, boot, conformance, regression)'
    required: true
  arch:
    description: 'Architecture (x86_64/riscv64/loongarch64/aarch64)'
    required: false
  release:
    description: 'Whether to run in release mode'
    required: false
  scheme:
    description: 'Test scheme (default/microvm/iommu)'
    required: false
  cache_osdk:
    description: 'Cache the dedicated Cargo target directory for installing OSDK'
    default: 'false'
  cache_kernel:
    description: 'Cache ordinary kernel Cargo outputs for compile and integration jobs'
    default: 'false'
  cache_save:
    description: 'Save build caches from a designated main-branch job'
    default: 'false'

  # VM Setup
  boot_protocol:
    description: 'Boot protocol (linux-efi-handover64/linux-efi-pe64/linux-legacy32/multiboot/multiboot2/pvh)'
    required: false
  enable_kvm:
    description: 'Enable KVM acceleration'
    required: false
  smp:
    description: 'Number of CPUs'
    required: false
  netdev:
    description: 'Network device type (user/tap)'
    required: false
  intel_tdx:
    description: 'Enable Intel TDX support'
    required: false
  mem:
    description: 'Guest memory size'
    required: false
  rootfs_boot:
    description: 'Boot directly from rootfs'
    required: false

  # Conformance Test
  conformance_test_suite:
    description: 'Selected conformance test suite'
    required: false
  conformance_test_workdir:
    description: 'Conformance test working directory'
    required: false
  conformance_test_extra_blocklists:
    description: 'Extra blocklists directories or files'
    required: false

  # Xfstest-specific parameters
  xfstests_fs_type:
    description: 'Filesystem type for xfstests (ext2, tmpfs, etc.)'
    required: false
  xfstests_runlist:
    description: 'Run list filename for xfstests'
    required: false
  xfstests_disk_size:
    description: 'The disk size for xfstests'
    required: false

  # Pjdfstest-specific parameters
  pjdfstest_fs_type:
    description: 'Filesystem under test for pjdfstest (ramfs, ext2, etc.)'
    required: false

runs:
  using: 'composite'
  steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup environment
      shell: bash
      run: |
        # Set common environment variables using GitHub's environment files
        #
        # Container jobs run with HOME=/github/home, and GitHub mounts a runner
        # directory there. Point rustup at the toolchain installed in the image
        # so that it is not downloaded again in every job.
        echo "RUSTUP_HOME=/root/.rustup" >> $GITHUB_ENV
        if [[ "${{ inputs.cache_kernel }}" == "true" ]]; then
          # Incremental state is large and has little reuse across fresh checkouts.
          echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
        fi
        if [[ "${{ inputs.intel_tdx }}" == "true" ]]; then
          echo "RUSTUP_DIST_SERVER=https://mirrors.ustc.edu.cn/rust-static" >> $GITHUB_ENV
          echo "RUSTUP_UPDATE_ROOT=https://mirrors.ustc.edu.cn/rust-static/rustup" >> $GITHUB_ENV
        fi

    - name: Prepare Cargo build caches
      if: ${{ inputs.cache_osdk == 'true' || inputs.cache_kernel == 'true' }}
      id: cache-config
      shell: bash
      env:
        CACHE_IMAGE: asterinas/kernel-dev:0.19.0-20261012
        CACHE_ARCH: ${{ inputs.arch }}
        CACHE_RELEASE: ${{ inputs.auto_test != 'general' && inputs.release || '' }}
        CACHE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
      run: |
        toolchain=$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)
        environment="$CACHE_IMAGE-$toolchain-$(uname -m)"
        arch=${CACHE_ARCH:-x86_64}
        case "$arch" in
          x86_64) triple=x86_64-unknown-none ;;
          riscv64) triple=riscv64imac-unknown-none-elf ;;
          loongarch64) triple=loongarch64-unknown-none-softfloat ;;
          aarch64) triple=aarch64-unknown-none-softfloat ;;
          *) echo "::error::Unsupported cache architecture: $arch"; exit 1 ;;
        esac
        profile=debug
        if [[ "$CACHE_RELEASE" == true ]]; then
          profile=release
        fi
        osdk_prefix="osdk-$environment-"
        kernel_prefix="kernel-$environment-$arch-$profile-"
        {
          echo "osdk_prefix=$osdk_prefix"
          echo "osdk_key=$osdk_prefix$CACHE_SHA"
          echo "kernel_prefix=$kernel_prefix"
          echo "kernel_key=$kernel_prefix$CACHE_SHA"
          echo "kernel_target=target/$triple/$profile"
          echo "host_target=target/$profile"
        } >> "$GITHUB_OUTPUT"

    - name: Restore OSDK build cache
      if: ${{ inputs.cache_osdk == 'true' }}
      id: osdk-cache
      uses: actions/cache/restore@v6
      continue-on-error: true
      with:
        path: /tmp/ci-osdk-target
        key: ${{ steps.cache-config.outputs.osdk_key }}
        restore-keys: ${{ steps.cache-config.outputs.osdk_prefix }}

    - name: Install OSDK from current source
      if: ${{ inputs.cache_osdk == 'true' }}
      shell: bash
      env:
        CACHE_OUTCOME: ${{ steps.osdk-cache.outcome }}
      run: |
        # A failed extraction can leave an incomplete target directory.
        if [[ "$CACHE_OUTCOME" != success ]]; then
          rm -rf -- /tmp/ci-osdk-target
        fi
        OSDK_LOCAL_DEV=1 cargo install --locked --force --path osdk \
          --target-dir /tmp/ci-osdk-target --root "$HOME/.cargo"
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

    - name: Save OSDK build cache
      if: >-
        ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' &&
            inputs.cache_save == 'true' && inputs.cache_osdk == 'true' &&
            steps.osdk-cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v6
      continue-on-error: true
      with:
        path: /tmp/ci-osdk-target
        key: ${{ steps.cache-config.outputs.osdk_key }}

    - name: Restore kernel build cache
      if: ${{ inputs.cache_kernel == 'true' }}
      id: kernel-cache
      uses: actions/cache/restore@v6
      continue-on-error: true
      with:
        path: |
          ${{ steps.cache-config.outputs.kernel_target }}
          ${{ steps.cache-config.outputs.host_target }}
        key: ${{ steps.cache-config.outputs.kernel_key }}
        restore-keys: ${{ steps.cache-config.outputs.kernel_prefix }}

    - name: Clean up failed kernel cache restore
      if: ${{ inputs.cache_kernel == 'true' && steps.kernel-cache.outcome != 'success' }}
      shell: bash
      env:
        KERNEL_TARGET: ${{ steps.cache-config.outputs.kernel_target }}
        HOST_TARGET: ${{ steps.cache-config.outputs.host_target }}
      run: rm -rf -- "$KERNEL_TARGET" "$HOST_TARGET"

    - name: Run basic tests
      if: ${{ inputs.auto_test == 'general' }}
      shell: bash
      run: |
        CMD=""
        [[ "${{ matrix.id }}" == "lint" ]] && CMD+="make check"
        [[ "${{ matrix.id }}" == "compile" ]] && CMD+="make kernel"
        [[ "${{ matrix.id }}" == "usermode_test" ]] && CMD+="make test"
        [[ "${{ matrix.id }}" == "ktest" ]] && CMD+="make ktest NETDEV=tap"
        [[ -n "${{ inputs.arch }}" ]] && CMD+=" TARGET_ARCH=${{ inputs.arch }}"

        echo "Executing: $CMD"
        eval $CMD

    - name: Run integration test
      if: ${{ !(inputs.auto_test == 'general' || inputs.auto_test == 'osdk') }}
      shell: bash
      run: |
        CMD="make run_kernel AUTO_TEST=${{ inputs.auto_test }}"
        [[ "${{ inputs.intel_tdx }}" == "true" ]] && CMD+=" INTEL_TDX=1"
        [[ "${{ inputs.release }}" == "true" ]] && CMD+=" RELEASE=1"
        [[ "${{ inputs.enable_kvm }}" == "false" ]] && CMD+=" ENABLE_KVM=0"
        [[ -n "${{ inputs.smp }}" ]] && CMD+=" SMP=${{ inputs.smp }}"
        [[ -n "${{ inputs.netdev }}" ]] && CMD+=" NETDEV=${{ inputs.netdev }}"
        [[ -n "${{ inputs.scheme }}" ]] && CMD+=" SCHEME=${{ inputs.scheme }}"
        [[ -n "${{ inputs.arch }}" ]] && CMD+=" TARGET_ARCH=${{ inputs.arch }}"
        [[ -n "${{ inputs.conformance_test_suite }}" ]] && CMD+=" CONFORMANCE_TEST_SUITE=${{ inputs.conformance_test_suite }}"
        [[ -n "${{ inputs.conformance_test_workdir }}" ]] && CMD+=" CONFORMANCE_TEST_WORKDIR=${{ inputs.conformance_test_workdir }}"
        [[ -n "${{ inputs.conformance_test_extra_blocklists }}" ]] && CMD+=" CONFORMANCE_TEST_EXTRA_BLOCKLISTS=${{ inputs.conformance_test_extra_blocklists }}"
        [[ -n "${{ inputs.boot_protocol }}" ]] && CMD+=" BOOT_PROTOCOL=${{ inputs.boot_protocol }}"
        [[ -n "${{ inputs.mem }}" ]] && CMD+=" MEM=${{ inputs.mem }}"
        [[ "${{ inputs.rootfs_boot }}" == "true" ]] && CMD+=" INITRAMFS=off CMDLINE='root=/dev/vdd rootfstype=ext2 init=/init'"
        [[ -n "${{ inputs.xfstests_fs_type }}" ]] && CMD+=" XFSTESTS_FS_TYPE=${{ inputs.xfstests_fs_type }}"
        [[ -n "${{ inputs.xfstests_runlist }}" ]] && CMD+=" XFSTESTS_RUNLIST=${{ inputs.xfstests_runlist }}"
        [[ -n "${{ inputs.xfstests_disk_size }}" ]] && CMD+=" XFSTESTS_DISK_SIZE=${{ inputs.xfstests_disk_size }}"
        [[ -n "${{ inputs.pjdfstest_fs_type }}" ]] && CMD+=" PJDFSTEST_FS_TYPE=${{ inputs.pjdfstest_fs_type }}"

        echo "Executing: $CMD"
        eval $CMD

    - name: Run OSDK tests
      if: ${{ inputs.auto_test == 'osdk' }}
      shell: bash
      run: |
        [[ "${{ !contains(matrix.container, 'osdk') }}" == "true" ]] && make check_osdk
        if [[ "${{ inputs.intel_tdx }}" == "true" ]]; then
          make test_osdk INTEL_TDX=1
        else
          make test_osdk
        fi

    - name: Save kernel build cache
      if: >-
        ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' &&
            inputs.cache_save == 'true' && inputs.cache_kernel == 'true' &&
            steps.kernel-cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v6
      continue-on-error: true
      with:
        path: |
          ${{ steps.cache-config.outputs.kernel_target }}
          ${{ steps.cache-config.outputs.host_target }}
        key: ${{ steps.cache-config.outputs.kernel_key }}
