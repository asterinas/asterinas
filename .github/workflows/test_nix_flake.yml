name: Test Nix flake

on:
  pull_request:
    paths:
      - flake.nix
      - flake.lock
      - Makefile
      - test/initramfs/Makefile
      - test/initramfs/nix/**
      - test/nixos/Makefile
      - tools/nixfmt.sh
      - distro/nixpkgs.nix
      - tools/dev_env/nix/**
      - rust-toolchain.toml
      - tools/dev_env/docker/prebuilt-nix-packages/Dockerfile
      - .github/workflows/test_nix_flake.yml
  push:
    branches:
      - main
    paths:
      - flake.nix
      - flake.lock
      - Makefile
      - test/initramfs/Makefile
      - test/initramfs/nix/**
      - test/nixos/Makefile
      - tools/nixfmt.sh
      - distro/nixpkgs.nix
      - tools/dev_env/nix/**
      - rust-toolchain.toml
      - tools/dev_env/docker/prebuilt-nix-packages/Dockerfile
      - .github/workflows/test_nix_flake.yml

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      # Make reads nixpkgs through distro/nixpkgs.nix.
      # Remove this check once Make uses the flake's nixpkgs input directly.
      - name: Check nixpkgs source
        run: |
          flake_source="$(nix flake archive --json --no-update-lock-file . | jq -r '.inputs.nixpkgs.path')"
          legacy_source="$(nix-instantiate --eval --strict --json --expr \
            'toString (import ./distro/nixpkgs.nix {}).path' | jq -r .)"
          if [ "$legacy_source" != "$flake_source" ]; then
            echo "Expected nixpkgs $flake_source, found $legacy_source in distro/nixpkgs.nix" >&2
            exit 1
          fi
      - name: Check flake
        run: nix flake check --no-build --all-systems --no-update-lock-file

  dev-shell-smoke:
    name: dev-shell-smoke (${{ matrix.runs_on }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs_on: ubuntu-latest
            enable_kvm: 1
          # The kernel is x86-64, so an ARM64 host has to run it under TCG.
          - runs_on: ubuntu-24.04-arm
            enable_kvm: 0
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Configure the development cache
        uses: cachix/cachix-action@v17
        with:
          name: aster-nixos-dev
          authToken: ${{ github.event_name == 'push' && secrets.CACHIX_AUTH_TOKEN_FOR_DEV_CACHE || '' }}
          skipPush: ${{ github.event_name != 'push' }}
      - name: Record the lock file
        run: sha256sum flake.lock > "$RUNNER_TEMP/flake-lock.sha256"
      - name: Check in Nix dev shell
        run: |
          nix develop --accept-flake-config --no-update-lock-file --ignore-environment --keep HOME \
            --command make check
      - name: Build and boot Asterinas
        run: |
          # Keep `NIX_USER_CONF_FILES` so nested Nix builds retain Cachix's post-build hook.
          nix develop --accept-flake-config --no-update-lock-file --ignore-environment --keep HOME \
            --keep NIX_USER_CONF_FILES \
            --command make run_kernel AUTO_TEST=boot ENABLE_KVM=${{ matrix.enable_kvm }}
      - name: Check the lock file is unchanged
        run: sha256sum --check "$RUNNER_TEMP/flake-lock.sha256"
