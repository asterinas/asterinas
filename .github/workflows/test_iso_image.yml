name: Test ISO image

on:
  workflow_dispatch:
  pull_request:
    paths:
      - distro/**
      - Makefile
      - test/nixos/**
      - .github/workflows/test_iso_image.yml
      - tools/nixos/**
      - tools/qemu_args.sh
  push:
    branches:
      - main
    paths:
      - distro/**
      - Makefile
      - test/nixos/**
      - .github/workflows/test_iso_image.yml
      - tools/nixos/**
      - tools/qemu_args.sh

jobs:
  live-iso-test:
    runs-on: ubuntu-4-cores-150GB-ssd
    container:
      image: asterinas/kernel-dev:0.18.1-20260926
      options: -v /dev:/dev --privileged
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build Asterinas NixOS Live ISO
        run: USE_ASTERINAS_KERNEL=true make iso NIXOS_TEST_SUITE=hello
      - name: Run hello tests in the Live ISO
        run: USE_ASTERINAS_KERNEL=true make run_iso NIXOS_TEST_SUITE=hello

  iso-test:
    runs-on: ubuntu-4-cores-150GB-ssd
    container:
      image: asterinas/kernel-dev:0.18.1-20260926
      options: -v /dev:/dev --privileged
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build Asterinas NixOS ISO installer image
        run: |
          make iso NIXOS_TEST_SUITE=hello
      - name: Run ISO image and install Asterinas NixOS
        run: |
          make run_iso || true
          tail --lines 10 qemu.log | grep -q "^Congratulations!" || (echo "Test ISO failed" && exit 1)
          echo "Test ISO succeeds!"
      - name : Run Asterinas NixOS
        run: |
          make run_nixos NIXOS_TEST_SUITE=hello
