name: "Test aarch64  "

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  basic-test:
    name: ${{ matrix.id }} (${{ matrix.runs_on }})
    runs-on: ${{ matrix.runs_on }}
    container:
      image: asterinas/kernel-dev:0.19.0-20261012
      options: -v /dev:/dev --privileged
      volumes:
        # Map the following directories on the host into the container so that
        # the container can remove them to save some precious disk space (~16GB),
        # which is quite limited on free-tier Github runners.
        - /usr/lib/google-cloud-sdk:/usr/lib/google-cloud-sdk
        - /usr/local/lib/android:/usr/local/lib/android
        - /usr/share/dotnet:/usr/share/dotnet
    strategy:
      matrix:
        runs_on: ['ubuntu-latest', 'ubuntu-24.04-arm']
        id: ['lint', 'compile']
      fail-fast: false
    steps:
      - name: Free disk space
        # Remove unused packages from the host to save disk space.
        run: rm -rf /usr/lib/google-cloud-sdk/* /usr/local/lib/android/* /usr/share/dotnet/*
      - uses: actions/checkout@v4
      - name: Run basic tests
        uses: ./.github/actions/test
        with:
          auto_test: 'general'
          arch: 'aarch64'
          cache_osdk: ${{ vars.CI_CACHE_OSDK != 'false' }}
          cache_kernel: ${{ vars.CI_CACHE_KERNEL != 'false' && matrix.id == 'compile' }}
          cache_save: ${{ matrix.id == 'compile' }}

  integration-test:
    name: ${{ matrix.test_id }} (${{ matrix.runs_on }})
    runs-on: ${{ matrix.runs_on }}
    container:
      image: asterinas/kernel-dev:0.19.0-20261012
      options: -v /dev:/dev --privileged
      volumes:
        # Map the following directories on the host into the container so that
        # the container can remove them to save some precious disk space (~16GB),
        # which is quite limited on free-tier Github runners.
        - /usr/lib/google-cloud-sdk:/usr/lib/google-cloud-sdk
        - /usr/local/lib/android:/usr/local/lib/android
        - /usr/share/dotnet:/usr/share/dotnet
    strategy:
      matrix:
        runs_on: ['ubuntu-latest', 'ubuntu-24.04-arm']
        test_id: ['boot', 'conformance']
        release: [true]
      fail-fast: false
    steps:
      - name: Free disk space
        # Remove unused packages from the host to save disk space.
        run: rm -rf /usr/lib/google-cloud-sdk/* /usr/local/lib/android/* /usr/share/dotnet/*
      - uses: actions/checkout@v4
      - name: Run ${{ matrix.test_id }} tests
        uses: ./.github/actions/test
        with:
          auto_test: ${{ matrix.test_id }}
          release: ${{ matrix.release }}
          arch: 'aarch64'
          # GitHub-hosted ARM runners do not expose /dev/kvm.
          # https://github.com/actions/runner-images/issues/14062#issuecomment-5352403358
          enable_kvm: false
          conformance_test_suite: 'ltp'
          cache_osdk: ${{ vars.CI_CACHE_OSDK != 'false' }}
          cache_kernel: ${{ vars.CI_CACHE_KERNEL != 'false' }}
          cache_save: ${{ matrix.test_id == 'boot' }}
