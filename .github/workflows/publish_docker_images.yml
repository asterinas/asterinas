name: Publish Docker images

on:
  workflow_dispatch:
  push:
    paths:
      - DOCKER_IMAGE_VERSION
    branches:
      - main

permissions:
  contents: read

jobs:
  # This file deliberately avoids `strategy: matrix` because:
  # 1. Publish jobs call a reusable workflow (`docker/github-builder`), which
  #    cannot be orchestrated with per-entry dependency ordering in this chain.
  # 2. Images must be built in order: `prebuilt-nix-packages` uses `osdk-dev`
  #    as its base, `kernel-dev` uses `prebuilt-nix-packages`, and `dev` uses
  #    `kernel-dev`.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      image_version: ${{ steps.prepare.outputs.image_version }}
      rust_version: ${{ steps.prepare.outputs.rust_version }}
      osdk-dev_existed: ${{ steps.prepare.outputs.osdk-dev_existed }}
      prebuilt-nix-packages_existed: ${{ steps.prepare.outputs.prebuilt-nix-packages_existed }}
      kernel-dev_existed: ${{ steps.prepare.outputs.kernel-dev_existed }}
      dev_existed: ${{ steps.prepare.outputs.dev_existed }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            DOCKER_IMAGE_VERSION
            rust-toolchain.toml
            tools/github_workflows
      - name: Prepare for Docker build and push
        id: prepare
        run: |
          ./tools/github_workflows/prepare_for_docker_build_and_push.sh "${{ secrets.DOCKERHUB_USERNAME }}" "${{ secrets.DOCKERHUB_TOKEN }}"

  publish_osdk_dev_image:
    needs: prepare
    if: ${{ needs.prepare.outputs.osdk-dev_existed != 'true' }}
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      id-token: write # for cosign keyless signing of provenance attestations
    with:
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      context: .
      file: ./osdk/tools/docker/Dockerfile
      meta-images: asterinas/osdk-dev
      meta-tags: |
        type=raw,value=${{ needs.prepare.outputs.image_version }}
      build-args: |
        ASTER_RUST_VERSION=${{ needs.prepare.outputs.rust_version }}
    secrets:
      registry-auths: |
        - registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

  publish_prebuilt_nix_packages_image:
    needs: [prepare, publish_osdk_dev_image]
    # Run even if publish_osdk_dev_image was skipped because the OSDK image exists.
    if: ${{ !cancelled() && !failure() && needs.prepare.outputs.prebuilt-nix-packages_existed != 'true' }}
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      id-token: write # for cosign keyless signing of provenance attestations
    with:
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      context: .
      file: ./tools/docker/prebuilt-nix-packages/Dockerfile
      meta-images: asterinas/prebuilt-nix-packages
      meta-tags: |
        type=raw,value=${{ needs.prepare.outputs.image_version }}
      build-args: |
        BASE_VERSION=${{ needs.prepare.outputs.image_version }}
    secrets:
      registry-auths: |
        - registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

  publish_kernel_dev_image:
    needs: [prepare, publish_prebuilt_nix_packages_image]
    # Run even if publish_prebuilt_nix_packages_image was skipped because the Nix image exists.
    if: ${{ !cancelled() && !failure() && needs.prepare.outputs.kernel-dev_existed != 'true' }}
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      id-token: write # for cosign keyless signing of provenance attestations
    with:
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      context: .
      file: ./tools/docker/kernel-dev/Dockerfile
      meta-images: asterinas/kernel-dev
      meta-tags: |
        type=raw,value=${{ needs.prepare.outputs.image_version }}
      build-args: |
        BASE_VERSION=${{ needs.prepare.outputs.image_version }}
    secrets:
      registry-auths: |
        - registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

  publish_dev_image:
    needs: [prepare, publish_kernel_dev_image]
    # Run even if publish_kernel_dev_image was skipped because the image exists.
    if: ${{ !cancelled() && !failure() && needs.prepare.outputs.dev_existed != 'true' }}
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      id-token: write # for cosign keyless signing of provenance attestations
    with:
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      context: .
      file: ./tools/docker/Dockerfile
      meta-images: asterinas/dev
      meta-tags: |
        type=raw,value=${{ needs.prepare.outputs.image_version }}
      build-args: |
        BASE_VERSION=${{ needs.prepare.outputs.image_version }}
    secrets:
      registry-auths: |
        - registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
